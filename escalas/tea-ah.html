<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QY1N9587DG"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEA-AH</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#4a148c 0%,#7b1fa2 100%);min-height:100vh;padding:20px}
        .container{max-width:900px;margin:0 auto;background:white;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.2);overflow:hidden}
        .header{background:linear-gradient(135deg,#4a148c,#7b1fa2);color:white;padding:30px;text-align:center}
        .header h1{font-size:2em;margin-bottom:5px}.header p{opacity:0.9}
        .content{padding:30px}
        .dados-pessoais{background:#f8f9fa;padding:20px;border-radius:10px;border-left:4px solid #4a148c;margin-bottom:20px}
        .dados-pessoais h2{color:#4a148c;margin-bottom:15px;font-size:1.1em}
        .form-row{display:flex;gap:15px;margin-bottom:10px;flex-wrap:wrap}
        .form-group{flex:1;min-width:200px}
        .form-group label{display:block;font-weight:600;margin-bottom:4px;color:#555;font-size:0.9em}
        .form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px}
        .bloco{margin-bottom:20px}.bloco-header{background:#4a148c;color:white;padding:10px 15px;border-radius:6px;font-weight:bold;margin-bottom:10px}
        .item{padding:12px;border-bottom:1px solid #eee;transition:background 0.2s}.item:hover{background:#f8f9fa}
        .item-texto{margin-bottom:8px;font-size:0.95em}.item-numero{font-weight:bold;color:#4a148c;margin-right:5px}
        .opcoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
        .opcao{text-align:center}.opcao label{display:block;font-size:0.75em;color:#666;cursor:pointer;padding:4px 8px;border-radius:4px}
        .opcao label:hover{background:#f0f0f0}.opcao input[type=radio]{margin:0 auto;display:block}
        .botoes{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
        .btn{padding:12px 25px;border:none;border-radius:25px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s}
        .btn-primary{background:linear-gradient(135deg,#4a148c,#7b1fa2);color:white}
        .btn-secondary{background:linear-gradient(135deg,#28a745,#218838);color:white}
        .btn-danger{background:linear-gradient(135deg,#dc3545,#c82333);color:white}
        .btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,0.2)}
        .resultados{display:none;margin-top:20px;padding:20px;background:#f8f9fa;border-radius:10px}
        @media print{.botoes,.btn,.info-tecnica,.resultados{display:none!important}body{background:white!important;padding:0!important}.container{box-shadow:none!important}.header{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
        @media(max-width:768px){.form-row{flex-direction:column}.opcoes{gap:4px}.botoes{flex-direction:column}.btn{width:100%}}
    </style>
    <script src="../id-paciente.js"></script>

<body>
<div style="padding:10px 20px;background:#2e7d32;"><a href="../" style="display:inline-block;background:#fff;color:#2e7d32;text-decoration:none;font-size:14px;font-weight:bold;padding:8px 20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.15);">&#11013; Voltar ao In&#237;cio</a></div>
<div class="container">
    <div class="header"><h1>TEA-AH</h1><p>Triagem de Espectro Autista em Altas Habilidades</p></div>
    <div class="content">
        <div class="dados-pessoais info-tecnica" style="position:relative"><button onclick="window.print()" style="position:absolute;top:15px;right:15px;padding:8px 16px;background:#4a148c;color:white;border:none;border-radius:15px;cursor:pointer;font-size:13px">Imprimir</button><h2>Informa&#231;&#245;es T&#233;cnicas</h2><p style="color:#555;line-height:1.6;font-size:0.9em"><strong>Instrumento:</strong> TEA-AH<br><strong>Escala:</strong> Likert 5 pontos</p></div>
        <div class="dados-pessoais"><h2>Dados Pessoais</h2>
            <div class="form-row"><div class="form-group"><label>Nome:</label><input type="text" id="nome"></div><div class="form-group"><label>Data de Nascimento:</label><input type="date" id="dataNascimento" onchange="calcularIdade()"></div></div>
            <div class="form-row"><div class="form-group"><label>Idade:</label><input type="text" id="idade" readonly style="background:#f0f0f0"></div><div class="form-group"><label>Sexo:</label><select id="sexo"><option value="">Selecione</option><option value="Masculino">Masculino</option><option value="Feminino">Feminino</option></select></div><div class="form-group"><label>Escolaridade:</label><select id="escolaridade"><option value="">Selecione</option><option value="Fundamental incompleto">Fundamental incompleto</option><option value="Fundamental completo">Fundamental completo</option><option value="Medio incompleto">M&#233;dio incompleto</option><option value="Medio completo">M&#233;dio completo</option><option value="Superior incompleto">Superior incompleto</option><option value="Superior completo">Superior completo</option><option value="Pos-graduacao">P&#243;s-gradua&#231;&#227;o</option></select></div><div class="form-group"><label>Data:</label><input type="date" id="data"></div></div>
        </div>
        <div id="questionario"></div>
        <div class="botoes"><button class="btn btn-primary" onclick="calcularResultados()">Calcular Resultados</button><button class="btn btn-secondary" onclick="gerarRelatorioPDF()">Gerar PDF</button><button class="btn btn-danger" onclick="limparDados()">Limpar Dados</button></div>
        <div id="resultados" class="resultados"></div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var BLOCOS = {
"1. Processamento Sensorial":[
"Demonstra inc\u00f4modo com etiquetas, tecidos ou sapatos",
"Reage de forma intensa a sons (barulho, vozes, aspirador, m\u00fasica alta)",
"Evita lugares com muitas pessoas ou muito est\u00edmulo visual",
"\u00c9 muito seletiva com alimentos por textura, cor ou cheiro",
"Procura movimentos repetitivos (balan\u00e7ar, girar, pular)"
],
"2. Comunica\u00e7\u00e3o e Linguagem":[
"Usou frases completas cedo (antes dos 2 anos e meio)",
"Usa linguagem literal (entende tudo ao p\u00e9 da letra)",
"Fala de seus interesses de forma intensa e repetitiva",
"Entende piadas, met\u00e1foras ou ironias",
"Corrige adultos ou se frustra quando algo \u00e9 'injusto' ou 'errado'"
],
"3. Intera\u00e7\u00e3o Social":[
"Prefere brincar sozinha",
"Se aproxima de outras crian\u00e7as com facilidade",
"Demonstra empatia (percebe quando algu\u00e9m est\u00e1 triste ou bravo)",
"Tem amigos ou v\u00ednculos sociais est\u00e1veis",
"Se desregula em ambientes sociais (escola, festas, recreio)"
],
"4. Cogni\u00e7\u00e3o e Interesses":[
"Aprende r\u00e1pido e faz perguntas complexas para a idade",
"Se interessa intensamente por um tema espec\u00edfico",
"Demonstra criatividade ou ideias originais",
"Se irrita quando erra ou quando algo \u00e9 'f\u00e1cil demais'",
"Transfere o que aprende para novas situa\u00e7\u00f5es"
],
"5. Regula\u00e7\u00e3o Emocional":[
"Se desorganiza quando h\u00e1 mudan\u00e7as inesperadas",
"Chora ou se isola ap\u00f3s frustra\u00e7\u00f5es",
"Consegue nomear o que sente",
"Mostra necessidade de rotina e previsibilidade",
"Reage mal \u00e0 cr\u00edtica ou quando \u00e9 contrariado"
],
"6. Desempenho Global":[
"Demonstra curiosidade intensa e pensamento avan\u00e7ado",
"Mostra sensibilidade emocional e/ou art\u00edstica elevada",
"Apresenta descompasso entre desempenho intelectual e social",
"Mostra habilidades not\u00e1veis em uma \u00e1rea e dificuldades em outra"
]
};
var OPCOES = ["Nunca","Raramente","Às vezes","Frequentemente","Sempre"];

function gerarQuestionario(){var c=document.getElementById("questionario");var html="";var idx=0;var blocos=Object.keys(BLOCOS);for(var b=0;b<blocos.length;b++){html+='<div class="bloco"><div class="bloco-header">'+blocos[b]+'</div>';for(var i=0;i<BLOCOS[blocos[b]].length;i++){html+='<div class="item"><div class="item-texto"><span class="item-numero">'+(idx+1)+'.</span> '+BLOCOS[blocos[b]][i]+'</div>';html+='<div class="opcoes">';for(var v=0;v<OPCOES.length;v++){html+='<div class="opcao"><input type="radio" id="it'+idx+'_'+(v+1)+'" name="it'+idx+'" value="'+(v+1)+'"><label for="it'+idx+'_'+(v+1)+'">'+OPCOES[v]+'</label></div>';}html+='</div></div>';idx++;}html+='</div>';}c.innerHTML=html;}

function calcularIdade(){var dn=document.getElementById("dataNascimento").value;if(!dn)return;var nasc=new Date(dn+"T00:00:00");var hoje=new Date();var anos=hoje.getFullYear()-nasc.getFullYear();var meses=hoje.getMonth()-nasc.getMonth();if(hoje.getDate()<nasc.getDate())meses--;if(meses<0){anos--;meses+=12;}document.getElementById("idade").value=anos+" anos, "+meses+" meses";}

function calcularResultados(){var nome=document.getElementById("nome").value.trim();if(!nome){alert("Preencha o nome.");return;}var resultados={};var totalGeral=0;var idx=0;var itensResp=0;var totalItens=0;var blocos=Object.keys(BLOCOS);for(var b=0;b<blocos.length;b++){var pont=0;var itens=0;for(var i=0;i<BLOCOS[blocos[b]].length;i++){var resp=document.querySelector('input[name="it'+idx+'"]:checked');if(resp){pont+=parseInt(resp.value);itens++;itensResp++;}idx++;totalItens++;}var media=itens>0?parseFloat((pont/itens).toFixed(2)):0;resultados[blocos[b]]={pontuacao:pont,media:media,itens:itens,max:BLOCOS[blocos[b]].length*OPCOES.length};totalGeral+=pont;}if(itensResp<totalItens){alert("Responda todos os itens. Faltam "+(totalItens-itensResp)+".");return;}var mediaGeral=parseFloat((totalGeral/totalItens).toFixed(2));var container=document.getElementById("resultados");var html='<h2 style="color:#4a148c;text-align:center;margin-bottom:15px">Resultados - '+document.title+'</h2>';for(var b=0;b<blocos.length;b++){var d=resultados[blocos[b]];var pct=Math.round((d.pontuacao/d.max)*100);html+='<div style="margin:8px 0;padding:10px;background:white;border-radius:6px;border-left:4px solid #4a148c"><strong>'+blocos[b]+':</strong> '+d.pontuacao+'/'+d.max+' (Media: '+d.media+')<div style="background:#e0e0e0;height:8px;border-radius:4px;margin-top:5px"><div style="background:#4a148c;height:8px;border-radius:4px;width:'+pct+'%"></div></div></div>';}html+='<div style="background:#f0f0f0;padding:15px;border-radius:8px;text-align:center;margin:15px 0"><h3>Total: '+totalGeral+' | Media Geral: '+mediaGeral+'</h3></div>';html+='<p style="font-size:0.85em;color:#666;text-align:center"><em>Instrumento de triagem. Nao substitui avaliacao profissional.</em></p>';container.innerHTML=html;container.style.display="block";container.scrollIntoView({behavior:"smooth"});window._escalaDados={escala:document.title,paciente:nome,escore:totalGeral,media:mediaGeral,classificacao:mediaGeral<2?"Baixa":mediaGeral<3?"Media":mediaGeral<4?"Alta":"Muito Alta",dominios:resultados,idPaciente:(document.getElementById("idPaciente")?document.getElementById("idPaciente").value:""),data:new Date().toISOString()};if(window.injetarBotaoSalvar)injetarBotaoSalvar("resultados");}

function gerarRelatorioPDF(){if(!window._escalaDados){calcularResultados();if(!window._escalaDados)return;}var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF();doc.setFillColor(0,0,0);doc.rect(0,0,210,30,"F");doc.setTextColor(255,255,255);doc.setFontSize(16);doc.setFont(undefined,"bold");doc.text(document.title+" - RELATORIO",105,15,{align:"center"});doc.setTextColor(0,0,0);doc.setFont(undefined,"normal");doc.setFontSize(10);var y=40;doc.text("Nome: "+document.getElementById("nome").value,20,y);var idEl=document.getElementById("idPaciente");if(idEl&&idEl.value)doc.text("ID: "+idEl.value,140,y);y+=6;doc.text("Idade: "+(document.getElementById("idade").value||""),20,y);y+=6;doc.text("Data: "+(document.getElementById("data").value||""),20,y);y+=12;var dados=window._escalaDados;var blocos=Object.keys(dados.dominios);doc.setFont(undefined,"bold");doc.text("RESULTADOS POR DOMINIO:",20,y);y+=8;doc.setFont(undefined,"normal");for(var b=0;b<blocos.length;b++){var d=dados.dominios[blocos[b]];doc.text(blocos[b]+": "+d.pontuacao+"/"+d.max+" (Media: "+d.media+")",25,y);y+=6;if(y>270){doc.addPage();y=20;}}y+=5;doc.setFont(undefined,"bold");doc.text("TOTAL: "+dados.escore+" | MEDIA GERAL: "+dados.media,20,y);doc.setTextColor(150,150,150);doc.setFontSize(8);doc.setFont(undefined,"italic");doc.text("Documento gerado em "+new Date().toLocaleString(),105,285,{align:"center"});var ts=new Date();doc.save(document.title.replace(/[^a-zA-Z0-9]/g,"_")+"_"+(document.getElementById("nome").value||"Paciente")+"_"+ts.getFullYear()+String(ts.getMonth()+1).padStart(2,"0")+String(ts.getDate()).padStart(2,"0")+".pdf");}

function limparDados(){if(!confirm("Limpar todos os dados?"))return;document.querySelectorAll("input[type=radio]").forEach(function(el){el.checked=false;});document.querySelectorAll("input[type=text],input[type=date]").forEach(function(el){if(el.id!=="data")el.value="";});document.getElementById("sexo").value="";document.getElementById("resultados").style.display="none";window._escalaDados=null;}

var _sessionInfo=null;var _API_URL="https://ccdzxqdclufzryxzgtvq7t5wsi0javug.lambda-url.sa-east-1.on.aws";
function _decodificarURL(){var params=new URLSearchParams(window.location.search);var d=params.get("d");if(!d)return false;try{_sessionInfo=JSON.parse(atob(decodeURIComponent(d)));}catch(e){return false;}var nomeEl=document.getElementById("nome");var nascEl=document.getElementById("dataNascimento");var sexoEl=document.getElementById("sexo");if(nomeEl&&_sessionInfo.patientName)nomeEl.value=_sessionInfo.patientName;if(nascEl&&_sessionInfo.birthDate){nascEl.value=_sessionInfo.birthDate;calcularIdade();}if(sexoEl&&_sessionInfo.sex)sexoEl.value=_sessionInfo.sex;if(nomeEl)nomeEl.dispatchEvent(new Event("input"));if(nascEl)nascEl.dispatchEvent(new Event("change"));var botoes=document.querySelector(".botoes");if(botoes)botoes.innerHTML='<button class="btn" style="padding:15px 30px;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#2e7d32,#43a047);color:white;" onclick="_enviarResultadosPainel()">Enviar Resultados ao Profissional</button>';var infoTec=document.querySelector(".info-tecnica");if(infoTec)infoTec.style.display="none";return true;}

async function _enviarResultadosPainel(){var nomeEl=document.getElementById("nome");if(nomeEl&&!nomeEl.value.trim()){alert("Preencha o nome antes de enviar.");return;}if(!window._escalaDados){calcularResultados();if(!window._escalaDados)return;}var dados=window._escalaDados;var idEl=document.getElementById("idPaciente");if(idEl)dados.idPaciente=idEl.value||"";dados.data=new Date().toISOString();var btn=document.querySelector(".botoes button");if(btn){btn.disabled=true;btn.textContent="Enviando...";}try{var resp=await fetch(_API_URL+"/save-escala",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:_sessionInfo.sessionId,email:_sessionInfo.email,data:dados})});var result=await resp.json();if(result.ok||resp.ok){var container=document.querySelector(".botoes");if(container)container.innerHTML='<div style="background:#c8e6c9;border:2px solid #2e7d32;border-radius:10px;padding:20px;text-align:center"><p style="font-size:1.3em;color:#2e7d32;font-weight:bold">Resultados enviados com sucesso!</p><p style="color:#555;margin-top:8px">O profissional ja pode visualizar seus resultados no painel.</p></div>';var res=document.getElementById("resultados");if(res)res.style.display="none";}else{if(btn){btn.disabled=false;btn.textContent="Enviar Resultados ao Profissional";}alert("Erro ao enviar.");}}catch(e){if(btn){btn.disabled=false;btn.textContent="Enviar Resultados ao Profissional";}alert("Erro de conexao.");}}

gerarQuestionario();
document.getElementById("data").value=new Date().toISOString().split("T")[0];
var _params=new URLSearchParams(window.location.search);
if(_params.get("d")){_decodificarURL();}else if(_params.get("print")){var _b=document.querySelector(".botoes");if(_b)_b.style.display="none";setTimeout(function(){window.print();},500);}else if(!window.location.protocol.startsWith("file")){window.location.href="https://setmonte.github.io/online/";}
</script>
<script>
if(!new URLSearchParams(window.location.search).get("d")){var s1=document.createElement("script");s1.src="pdf-escalas.js";document.body.appendChild(s1);var s2=document.createElement("script");s2.src="salvar-escala.js";document.body.appendChild(s2);}
</script>
<script>var _sc=document.createElement('script');_sc.src='coleta-anonima.js';document.body.appendChild(_sc);</script>
<div style="text-align:center;padding:15px;color:#999;font-size:0.75em;margin-top:20px;">Dados an&#244;nimos e n&#227;o-identific&#225;veis podem ser utilizados para fins de pesquisa e normatiza&#231;&#227;o.</div>
</body>
