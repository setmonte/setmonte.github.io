<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Teste</title></head>
<body>
<div class="botoes">
<button onclick="alert('oi')">BOTAO ORIGINAL</button>
</div>
<script>
function _decodificarURL() {
    var botoes = document.querySelector('.botoes');
    if (botoes) {
        botoes.innerHTML = '<button style="padding:15px 30px;background:green;color:white;border:none;border-radius:25px;font-size:16px;cursor:pointer;" onclick="_enviarResultadosPainel()">Enviar Resultados ao Profissional</button>';
    }
    return true;
}

function _enviarResultadosPainel() {
    alert('Enviando!');
}

document.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('d')) {
        _decodificarURL();
    }
});
</script>
</body>
</html>
