var OPCOES = ["Nunca","Raramente","Ocasionalmente","Frequentemente","Sempre"];

function gerarQuestionario(){var c=document.getElementById("questionario");var html="";var idx=0;var blocos=Object.keys(BLOCOS);for(var b=0;b<blocos.length;b++){html+='<div class="bloco"><div class="bloco-header">'+blocos[b]+'</div>';for(var i=0;i<BLOCOS[blocos[b]].length;i++){html+='<div class="item"><div class="item-texto"><span class="item-numero">'+(idx+1)+'.</span> '+BLOCOS[blocos[b]][i]+'</div>';html+='<div class="opcoes">';for(var v=0;v<OPCOES.length;v++){html+='<div class="opcao"><input type="radio" id="it'+idx+'_'+(v+1)+'" name="it'+idx+'" value="'+(v+1)+'"><label for="it'+idx+'_'+(v+1)+'">'+OPCOES[v]+'</label></div>';}html+='</div></div>';idx++;}html+='</div>';}c.innerHTML=html;}

function calcularIdade(){var dn=document.getElementById("dataNascimento").value;if(!dn)return;var nasc=new Date(dn+"T00:00:00");var hoje=new Date();var anos=hoje.getFullYear()-nasc.getFullYear();var meses=hoje.getMonth()-nasc.getMonth();if(hoje.getDate()<nasc.getDate())meses--;if(meses<0){anos--;meses+=12;}document.getElementById("idade").value=anos+" anos, "+meses+" meses";}

function calcularResultados(){var nome=document.getElementById("nome").value.trim();if(!nome){alert("Preencha o nome.");return;}var resultados={};var totalGeral=0;var idx=0;var itensResp=0;var totalItens=0;var blocos=Object.keys(BLOCOS);for(var b=0;b<blocos.length;b++){var pont=0;var itens=0;for(var i=0;i<BLOCOS[blocos[b]].length;i++){var resp=document.querySelector('input[name="it'+idx+'"]:checked');if(resp){pont+=parseInt(resp.value);itens++;itensResp++;}idx++;totalItens++;}var media=itens>0?parseFloat((pont/itens).toFixed(2)):0;resultados[blocos[b]]={pontuacao:pont,media:media,itens:itens,max:BLOCOS[blocos[b]].length*OPCOES.length};totalGeral+=pont;}if(itensResp<totalItens){alert("Responda todos os itens. Faltam "+(totalItens-itensResp)+".");return;}var mediaGeral=parseFloat((totalGeral/totalItens).toFixed(2));var container=document.getElementById("resultados");var html='<h2 style="color:#1565c0;text-align:center;margin-bottom:15px">Resultados - '+document.title+'</h2>';for(var b=0;b<blocos.length;b++){var d=resultados[blocos[b]];var pct=Math.round((d.pontuacao/d.max)*100);html+='<div style="margin:8px 0;padding:10px;background:white;border-radius:6px;border-left:4px solid #1565c0"><strong>'+blocos[b]+':</strong> '+d.pontuacao+'/'+d.max+' (Media: '+d.media+')<div style="background:#e0e0e0;height:8px;border-radius:4px;margin-top:5px"><div style="background:#1565c0;height:8px;border-radius:4px;width:'+pct+'%"></div></div></div>';}html+='<div style="background:#f0f0f0;padding:15px;border-radius:8px;text-align:center;margin:15px 0"><h3>Total: '+totalGeral+' | Media Geral: '+mediaGeral+'</h3></div>';html+='<p style="font-size:0.85em;color:#666;text-align:center"><em>Instrumento de triagem. Nao substitui avaliacao profissional.</em></p>';container.innerHTML=html;container.style.display="block";container.scrollIntoView({behavior:"smooth"});window._escalaDados={escala:document.title,paciente:nome,escore:totalGeral,media:mediaGeral,classificacao:mediaGeral<2?"Baixa":mediaGeral<3?"Media":mediaGeral<4?"Alta":"Muito Alta",dominios:resultados,idPaciente:(document.getElementById("idPaciente")?document.getElementById("idPaciente").value:""),data:new Date().toISOString()};if(window.injetarBotaoSalvar)injetarBotaoSalvar("resultados");}

function gerarRelatorioPDF(){if(!window._escalaDados){calcularResultados();if(!window._escalaDados)return;}var jsPDF=window.jspdf.jsPDF;var doc=new jsPDF();doc.setFillColor(0,0,0);doc.rect(0,0,210,30,"F");doc.setTextColor(255,255,255);doc.setFontSize(16);doc.setFont(undefined,"bold");doc.text(document.title+" - RELATORIO",105,15,{align:"center"});doc.setTextColor(0,0,0);doc.setFont(undefined,"normal");doc.setFontSize(10);var y=40;doc.text("Nome: "+document.getElementById("nome").value,20,y);var idEl=document.getElementById("idPaciente");if(idEl&&idEl.value)doc.text("ID: "+idEl.value,140,y);y+=6;doc.text("Idade: "+(document.getElementById("idade").value||""),20,y);y+=6;doc.text("Data: "+(document.getElementById("data").value||""),20,y);y+=12;var dados=window._escalaDados;var blocos=Object.keys(dados.dominios);doc.setFont(undefined,"bold");doc.text("RESULTADOS POR DOMINIO:",20,y);y+=8;doc.setFont(undefined,"normal");for(var b=0;b<blocos.length;b++){var d=dados.dominios[blocos[b]];doc.text(blocos[b]+": "+d.pontuacao+"/"+d.max+" (Media: "+d.media+")",25,y);y+=6;if(y>270){doc.addPage();y=20;}}y+=5;doc.setFont(undefined,"bold");doc.text("TOTAL: "+dados.escore+" | MEDIA GERAL: "+dados.media,20,y);doc.setTextColor(150,150,150);doc.setFontSize(8);doc.setFont(undefined,"italic");doc.text("Documento gerado em "+new Date().toLocaleString(),105,285,{align:"center"});var ts=new Date();doc.save(document.title.replace(/[^a-zA-Z0-9]/g,"_")+"_"+(document.getElementById("nome").value||"Paciente")+"_"+ts.getFullYear()+String(ts.getMonth()+1).padStart(2,"0")+String(ts.getDate()).padStart(2,"0")+".pdf");}

function limparDados(){if(!confirm("Limpar todos os dados?"))return;document.querySelectorAll("input[type=radio]").forEach(function(el){el.checked=false;});document.querySelectorAll("input[type=text],input[type=date]").forEach(function(el){if(el.id!=="data")el.value="";});document.getElementById("sexo").value="";document.getElementById("resultados").style.display="none";window._escalaDados=null;}

var _sessionInfo=null;var _API_URL="https://ccdzxqdclufzryxzgtvq7t5wsi0javug.lambda-url.sa-east-1.on.aws";
function _decodificarURL(){var params=new URLSearchParams(window.location.search);var d=params.get("d");if(!d)return false;try{_sessionInfo=JSON.parse(atob(decodeURIComponent(d)));}catch(e){return false;}var nomeEl=document.getElementById("nome");var nascEl=document.getElementById("dataNascimento");var sexoEl=document.getElementById("sexo");if(nomeEl&&_sessionInfo.patientName)nomeEl.value=_sessionInfo.patientName;if(nascEl&&_sessionInfo.birthDate){nascEl.value=_sessionInfo.birthDate;calcularIdade();}if(sexoEl&&_sessionInfo.sex)sexoEl.value=_sessionInfo.sex;if(nomeEl)nomeEl.dispatchEvent(new Event("input"));if(nascEl)nascEl.dispatchEvent(new Event("change"));var botoes=document.querySelector(".botoes");if(botoes)botoes.innerHTML='<button class="btn" style="padding:15px 30px;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#2e7d32,#43a047);color:white;" onclick="_enviarResultadosPainel()">Enviar Resultados ao Profissional</button>';var infoTec=document.querySelector(".info-tecnica");if(infoTec)infoTec.style.display="none";return true;}

async function _enviarResultadosPainel(){var nomeEl=document.getElementById("nome");if(nomeEl&&!nomeEl.value.trim()){alert("Preencha o nome antes de enviar.");return;}var totalItens=document.querySelectorAll('.item').length;var respondidos=document.querySelectorAll('input[type="radio"]:checked').length;if(respondidos<totalItens){alert('Responda todos os '+totalItens+' itens antes de enviar. Faltam '+(totalItens-respondidos)+'.');return;}var sexoEl=document.getElementById('sexo');if(sexoEl&&!sexoEl.value){sexoEl.value='Nao informado';}var idadeEl=document.getElementById('idadeCalculada');if(idadeEl&&!idadeEl.value){idadeEl.value='Nao informado';}if(!window._escalaDados){calcularResultados();if(!window._escalaDados)return;}var dados=window._escalaDados;var idEl=document.getElementById("idPaciente");if(idEl)dados.idPaciente=idEl.value||"";dados.pacienteId=_sessionInfo?(_sessionInfo.pacienteId||''):'';dados.data=new Date().toISOString();var btn=document.querySelector(".botoes button");if(btn){btn.disabled=true;btn.textContent="Enviando...";}try{var resp=await fetch(_API_URL+"/save-escala",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:_sessionInfo.sessionId,email:_sessionInfo.email,data:dados,originalSessionId:_sessionInfo.sessionId})});var result=await resp.json();if(result.ok||resp.ok){var container=document.querySelector(".botoes");if(container)container.innerHTML='<div style="background:#c8e6c9;border:2px solid #2e7d32;border-radius:10px;padding:20px;text-align:center"><p style="font-size:1.3em;color:#2e7d32;font-weight:bold">Resultados enviados com sucesso!</p><p style="color:#555;margin-top:8px">O profissional ja pode visualizar seus resultados no painel.</p></div>';var res=document.getElementById("resultados");if(res)res.style.display="none";}else{if(btn){btn.disabled=false;btn.textContent="Enviar Resultados ao Profissional";}alert("Erro ao enviar.");}}catch(e){if(btn){btn.disabled=false;btn.textContent="Enviar Resultados ao Profissional";}alert("Erro de conexao.");}}

gerarQuestionario();
