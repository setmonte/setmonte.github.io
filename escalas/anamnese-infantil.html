function gerarFormulario(){
var container=document.getElementById('formulario');
var h='';
SECOES.forEach(function(secao,si){
h+='<div class="secao"><div class="secao-header">'+secao.titulo+'</div><div class="secao-body">';
secao.campos.forEach(function(campo){
var cond=campo.condicional?(' data-condicional="'+campo.condicional+'" data-valor="'+campo.valorCondicional+'"'):'';
var classeCond=campo.condicional?' campo-condicional':'';
h+='<div class="campo'+classeCond+'"'+cond+'>';
h+='<label for="'+campo.id+'">'+campo.label+(campo.obrigatorio?' <span style="color:#c62828;">*</span>':'')+'</label>';
if(campo.dica)h+='<div class="dica">'+campo.dica+'</div>';
if(campo.tipo==='text')h+='<input type="text" id="'+campo.id+'" name="'+campo.id+'">';
else if(campo.tipo==='date')h+='<input type="date" id="'+campo.id+'" name="'+campo.id+'">';
else if(campo.tipo==='number')h+='<input type="number" id="'+campo.id+'" name="'+campo.id+'">';
else if(campo.tipo==='textarea')h+='<textarea id="'+campo.id+'" name="'+campo.id+'" rows="3"></textarea>';
else if(campo.tipo==='radio'){
h+='<div class="radio-group">';
campo.opcoes.forEach(function(op,oi){
h+='<label><input type="radio" name="'+campo.id+'" value="'+op+'" onchange="checkCondicional(\''+campo.id+'\')"><span>'+op+'</span></label>';
});
h+='</div>';
}
h+='</div>';
});
h+='</div></div>';
});
container.innerHTML=h;
}

function checkCondicional(campoId){
var selecionado=document.querySelector('input[name="'+campoId+'"]:checked');
var valor=selecionado?selecionado.value:'';
document.querySelectorAll('[data-condicional="'+campoId+'"]').forEach(function(el){
if(valor===el.getAttribute('data-valor'))el.classList.add('visivel');
else el.classList.remove('visivel');
});
atualizarProgresso();
}

function atualizarProgresso(){
var total=0,preenchidos=0;
SECOES.forEach(function(secao){
secao.campos.forEach(function(campo){
if(campo.condicional)return;
total++;
if(campo.tipo==='radio'){
if(document.querySelector('input[name="'+campo.id+'"]:checked'))preenchidos++;
}else{
var el=document.getElementById(campo.id);
if(el&&el.value.trim())preenchidos++;
}
});
});
var pct=total>0?Math.round((preenchidos/total)*100):0;
document.getElementById('barraProgresso').style.width=pct+'%';
}

function coletarRespostas(){
var dados={};
SECOES.forEach(function(secao){
secao.campos.forEach(function(campo){
if(campo.tipo==='radio'){
var sel=document.querySelector('input[name="'+campo.id+'"]:checked');
dados[campo.id]=sel?sel.value:'';
}else{
var el=document.getElementById(campo.id);
dados[campo.id]=el?el.value.trim():'';
}
});
});
return dados;
}

function validar(){
var erros=[];
SECOES.forEach(function(secao){
secao.campos.forEach(function(campo){
if(!campo.obrigatorio)return;
if(campo.tipo==='radio'){
if(!document.querySelector('input[name="'+campo.id+'"]:checked'))erros.push(campo.label);
}else{
var el=document.getElementById(campo.id);
if(!el||!el.value.trim())erros.push(campo.label);
}
});
});
return erros;
}

// ===== MODO PAINEL =====
var _sessionInfo=null;
var _API_URL='https://ccdzxqdclufzryxzgtvq7t5wsi0javug.lambda-url.sa-east-1.on.aws';

function _decodificarURL(){
var params=new URLSearchParams(window.location.search);
var d=params.get('d');
if(!d)return false;
try{_sessionInfo=JSON.parse(atob(decodeURIComponent(d)));}catch(e){return false;}
var nomeEl=document.getElementById('nomeAvaliando');
if(nomeEl&&_sessionInfo.patientName)nomeEl.value=_sessionInfo.patientName;
var dnEl=document.getElementById('dnAvaliando');
if(dnEl&&_sessionInfo.birthDate)dnEl.value=_sessionInfo.birthDate;
return true;
}

async function enviarAnamnese(){
var erros=validar();
if(erros.length>0){alert('Preencha os campos obrigat\u00f3rios:\n- '+erros.join('\n- '));return;}
var dados=coletarRespostas();
dados._secoes=SECOES.map(function(s){return{titulo:s.titulo,campos:s.campos.map(function(c){return{id:c.id,label:c.label,tipo:c.tipo};})};});
if(_sessionInfo){
var btn=document.querySelector('.botoes .btn-primary');
if(btn){btn.disabled=true;btn.textContent='Enviando...';}
try{
var payload={sessionId:_sessionInfo.sessionId,email:_sessionInfo.email,data:{escala:'ANAMNESE-INF',paciente:dados.nomeAvaliando,respondente:dados.respondente,parentesco:dados.parentesco,respostas:dados,data:new Date().toISOString()}};
var resp=await fetch(_API_URL+'/save-escala',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
var result=await resp.json();
if(result.ok||resp.ok){
document.getElementById('botoesArea').style.display='none';
document.getElementById('formulario').style.display='none';
document.getElementById('msgSucesso').style.display='block';
}else{
if(btn){btn.disabled=false;btn.textContent='Enviar Respostas';}
alert('Erro ao enviar. Tente novamente.');
}
}catch(e){
if(btn){btn.disabled=false;btn.textContent='Enviar Respostas';}
alert('Erro de conex\u00e3o. Verifique sua internet.');
}
}else{
alert('Link inv\u00e1lido. Pe\u00e7a ao profissional para gerar um novo link.');
}
}
