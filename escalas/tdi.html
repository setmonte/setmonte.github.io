    <style>

        @media print { @page { size: portrait; margin: 1cm; } body { background: white !important; padding: 0 !important; } .botoes, .btn, .btn-imprimir, .actions { display: none !important; } .container { box-shadow: none !important; max-width: 100% !important; } .info-tecnica { display: none !important; } .resultados { display: none !important; } .header { -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 15px !important; } .header h1 { font-size: 1.5em !important; } .item { padding: 6px 10px !important; page-break-inside: avoid; break-inside: avoid; } .item-texto { margin-bottom: 5px !important; font-size: 0.9em !important; } .opcoes { display: inline-flex !important; flex-direction: row !important; flex-wrap: nowrap !important; justify-content: flex-start !important; gap: 15px !important; width: 100% !important; } .opcao { flex-direction: row !important; padding: 2px 5px !important; min-height: auto !important; min-width: auto !important; gap: 3px !important; } .opcao label { min-height: auto !important; font-size: 0.75em !important; } .opcao input[type="radio"] { width: 14px !important; height: 14px !important; } .parte-header { padding: 6px 12px !important; margin: 8px 0 4px !important; page-break-after: avoid; font-size: 0.95em !important; } .dados-pessoais { padding: 12px !important; margin-bottom: 10px !important; } .instrucoes { padding: 10px !important; margin-bottom: 10px !important; } .content { padding: 15px !important; } .form-row { margin-bottom: 5px !important; } } .options { display: flex !important; flex-direction: row !important; flex-wrap: wrap !important; justify-content: center !important; } }

<body>
<div style="padding:10px 20px;background:#2e7d32;"><a href="../" style="display:inline-block;background:#fff;color:#2e7d32;text-decoration:none;font-family:Segoe UI,Arial,sans-serif;font-size:14px;font-weight:bold;padding:8px 20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.15);transition:background 0.2s;">&#11013; Voltar ao In&#237;cio</a></div>
    <div class="container">
        <h1>ESCALA PARA AVALIAÇÃO DE TDI</h1>
        
        <div class="info">
            <input type="text" id="nome" placeholder="Nome">
            <input type="number" id="idade" placeholder="Idade">
            <input type="date" id="data">
            <input type="text" id="respondente" placeholder="Respondente">
        </div>

        <p style="margin-bottom: 20px; font-style: italic;">Marque "SIM" ou "NÃO" nas perguntas que identificar o comportamento do avaliado.</p>

        <div id="questions"></div>

        <button class="btn-calcular" onclick="calcular()">CALCULAR RESULTADOS</button>
        <button class="btn-exportar" onclick="gerarPDF()" style="display: none;" id="btn-exportar">📄 GERAR PDF / IMPRIMIR</button>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()" style="display: none;" id="btn-whatsapp">📱 ENVIAR POR WHATSAPP</button>
        <button class="btn-limpar" onclick="limpar()">LIMPAR RESPOSTAS</button>

        <div class="results" id="results" style="display: none;">
            <h2 style="margin-bottom: 15px;">Resultados</h2>
            <div class="result-item">
                <span class="result-label">Conceitual:</span>
                <span><span class="result-value" id="conceitual-score">0</span> - <span id="conceitual-status"></span></span>
            </div>
            <div class="result-item">
                <span class="result-label">Social:</span>
                <span><span class="result-value" id="social-score">0</span> - <span id="social-status"></span></span>
            </div>
            <div class="result-item">
                <span class="result-label">Prático:</span>
                <span><span class="result-value" id="pratico-score">0</span> - <span id="pratico-status"></span></span>
            </div>
        </div>
    </div>

    <script>
        const perguntas = [
            {texto: "Tem dificuldades para entender conceitos abstratos, como o tempo (ex.: ontem, amanhã, mais tarde).", dominio: 'conceitual', valor: 0},
            {texto: "É capaz de compreender instruções com várias etapas sem dificuldade.", dominio: 'conceitual', valor: 1},
            {texto: "Tem dificuldade em lembrar informações aprendidas recentemente.", dominio: 'conceitual', valor: 0},
            {texto: "Apresenta habilidades sociais adequadas para a idade.", dominio: 'social', valor: 1},
            {texto: "Demonstra baixa capacidade de resolução de problemas.", dominio: 'conceitual', valor: 0},
            {texto: "Tem dificuldades com habilidades básicas de autossuficiência, como higiene pessoal.", dominio: 'pratico', valor: 0},
            {texto: "Consegue controlar suas emoções de forma adequada.", dominio: 'social', valor: 1},
            {texto: "Necessita de ajuda frequente para realizar tarefas diárias.", dominio: 'pratico', valor: 0},
            {texto: "É capaz de entender piadas e sarcasmo.", dominio: 'social', valor: 1},
            {texto: "Demonstra dificuldades em aprender novas habilidades.", dominio: 'conceitual', valor: 0},
            {texto: "Mostra uma falta de iniciativa para realizar tarefas por conta própria.", dominio: 'social', valor: 0},
            {texto: "Sabe identificar sentimentos e emoções em outras pessoas.", dominio: 'social', valor: 1},
            {texto: "Tem dificuldades para entender e seguir regras sociais.", dominio: 'social', valor: 0},
            {texto: "Consegue participar de atividades grupais de forma produtiva.", dominio: 'social', valor: 1},
            {texto: "Necessita de ajuda constante para atividades diárias, como cozinhar.", dominio: 'pratico', valor: 0},
            {texto: "Consegue realizar cálculos matemáticos simples.", dominio: 'conceitual', valor: 1},
            {texto: "Tem dificuldade para se comunicar claramente.", dominio: 'social', valor: 0},
            {texto: "Demonstra habilidades básicas de planejamento.", dominio: 'conceitual', valor: 1},
            {texto: "Apresenta dificuldades em fazer amigos.", dominio: 'social', valor: 0},
            {texto: "É capaz de resolver conflitos de forma autônoma.", dominio: 'social', valor: 1},
            {texto: "Necessita de apoio para realizar atividades cotidianas como compras.", dominio: 'pratico', valor: 0},
            {texto: "Sabe expressar suas necessidades e vontades de forma clara.", dominio: 'pratico', valor: 1},
            {texto: "Demonstra um vocabulário limitado para sua idade.", dominio: 'conceitual', valor: 0},
            {texto: "Apresenta uma boa capacidade de memória a longo prazo.", dominio: 'conceitual', valor: 1},
            {texto: "Tem dificuldades para entender conceitos financeiros simples, como dinheiro.", dominio: 'conceitual', valor: 0},
            {texto: "Sabe gerenciar seu tempo de forma produtiva.", dominio: 'conceitual', valor: 1},
            {texto: "Tem dificuldade para seguir uma rotina.", dominio: 'conceitual', valor: 0},
            {texto: "Consegue fazer escolhas adequadas sem orientação.", dominio: 'pratico', valor: 1},
            {texto: "Demonstra dificuldades para tomar decisões importantes.", dominio: 'conceitual', valor: 0},
            {texto: "É capaz de cuidar de suas próprias necessidades básicas.", dominio: 'pratico', valor: 1},
            {texto: "Mostra baixa resistência a frustrações.", dominio: 'pratico', valor: 0},
            {texto: "Consegue comunicar bem suas ideias e necessidades.", dominio: 'pratico', valor: 1},
            {texto: "Demonstra dificuldades em resolver problemas de forma independente.", dominio: 'pratico', valor: 0},
            {texto: "Sabe administrar suas próprias finanças de forma adequada.", dominio: 'pratico', valor: 1},
            {texto: "Tem dificuldade para planejar atividades futuras.", dominio: 'pratico', valor: 0},
            {texto: "Mantém bons relacionamentos interpessoais.", dominio: 'social', valor: 1},
            {texto: "Apresenta pouca capacidade para resolver problemas complexos.", dominio: 'conceitual', valor: 0},
            {texto: "É responsável por suas tarefas diárias e realiza sem ajuda.", dominio: 'pratico', valor: 1},
            {texto: "Tem dificuldade em expressar emoções de maneira adequada.", dominio: 'social', valor: 0},
            {texto: "Demonstra habilidades sociais boas para a idade.", dominio: 'social', valor: 1},
            {texto: "Tem dificuldade para lidar com mudanças na rotina.", dominio: 'pratico', valor: 0},
            {texto: "Compreende instruções detalhadas e complexas.", dominio: 'conceitual', valor: 1},
            {texto: "Mostra baixa capacidade para aprender novas informações.", dominio: 'conceitual', valor: 0},
            {texto: "Demonstra segurança ao realizar atividades diárias.", dominio: 'pratico', valor: 1},
            {texto: "Necessita de supervisão constante para tarefas simples.", dominio: 'pratico', valor: 0},
            {texto: "Mantém o foco em uma tarefa até concluí-la.", dominio: 'conceitual', valor: 1},
            {texto: "Apresenta dificuldade para realizar tarefas que envolvam planejamento.", dominio: 'conceitual', valor: 0},
            {texto: "Lida bem com situações inesperadas e novas.", dominio: 'pratico', valor: 1},
            {texto: "Mostra pouca capacidade de reflexão sobre suas ações.", dominio: 'pratico', valor: 0},
            {texto: "Demonstra boa compreensão das normas sociais e culturais.", dominio: 'social', valor: 1}
        ];

        const respostas = {};

        function renderPerguntas() {
            const container = document.getElementById('questions');
            perguntas.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'question';
                div.innerHTML = `
                    <div class="question-text"><strong>${i + 1}.</strong> ${p.texto}</div>
                    <div class="options">
                        <button onclick="responder(${i}, 'sim')" id="btn-${i}-sim">SIM</button>
                        <button onclick="responder(${i}, 'nao')" id="btn-${i}-nao">NÃO</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function responder(index, resposta) {
            respostas[index] = resposta;
            document.getElementById(`btn-${index}-sim`).className = resposta === 'sim' ? 'selected-sim' : '';
            document.getElementById(`btn-${index}-nao`).className = resposta === 'nao' ? 'selected-nao' : '';
        }

        function calcular() {
            let conceitual = 0, social = 0, pratico = 0;

            perguntas.forEach((p, i) => {
                const resp = respostas[i];
                if (!resp) return;

                let pontos = p.valor;
                
                if (p.valor === 1 && resp === 'sim') {
                    pontos = 0;
                } else if (p.valor === 0 && resp === 'sim') {
                    pontos = 1;
                }

                if (p.dominio === 'conceitual') conceitual += pontos;
                if (p.dominio === 'social') social += pontos;
                if (p.dominio === 'pratico') pratico += pontos;
            });

            document.getElementById('conceitual-score').textContent = conceitual;
            document.getElementById('social-score').textContent = social;
            document.getElementById('pratico-score').textContent = pratico;

            const conceitualStatus = conceitual <= 7 ? 'Normal' : 'Dificuldades no domínio Conceitual';
            const socialStatus = social <= 9 ? 'Normal' : 'Dificuldades no domínio Social';
            const praticoStatus = pratico <= 8 ? 'Normal' : 'Dificuldades no domínio Prático';

            document.getElementById('conceitual-status').textContent = conceitualStatus;
            document.getElementById('conceitual-status').className = conceitual <= 7 ? 'normal' : 'dificuldade';
            
            document.getElementById('social-status').textContent = socialStatus;
            document.getElementById('social-status').className = social <= 9 ? 'normal' : 'dificuldade';
            
            document.getElementById('pratico-status').textContent = praticoStatus;
            document.getElementById('pratico-status').className = pratico <= 8 ? 'normal' : 'dificuldade';

            document.getElementById('results').style.display = 'block';
            document.getElementById('btn-exportar').style.display = 'block';
            document.getElementById('btn-whatsapp').style.display = 'block';
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
            window._escalaDados={escala:'TDI',paciente:document.getElementById('nome').value,escore:conceitual+social+pratico,dominios:{Conceitual:conceitual,Social:social,Pratico:pratico},classificacao:'C:'+conceitual+' S:'+social+' P:'+pratico,idPaciente:(document.getElementById('idPaciente')?document.getElementById('idPaciente').value:''),data:new Date().toISOString()};
            if(window.injetarBotaoSalvar)injetarBotaoSalvar('results');
        }

        function limpar() {
            Object.keys(respostas).forEach(key => delete respostas[key]);
            perguntas.forEach((p, i) => {
                document.getElementById(`btn-${i}-sim`).className = '';
                document.getElementById(`btn-${i}-nao`).className = '';
            });
            document.getElementById('results').style.display = 'none';
            document.getElementById('btn-exportar').style.display = 'none';
            document.getElementById('btn-whatsapp').style.display = 'none';
        }

        function gerarPDF() {
            window.print();
        }

        function enviarWhatsApp() {
            const nome = document.getElementById('nome').value || 'Não informado';
            const idade = document.getElementById('idade').value || 'Não informada';
            const data = document.getElementById('data').value || 'Não informada';
            const respondente = document.getElementById('respondente').value || 'Não informado';
            
            const conceitual = document.getElementById('conceitual-score').textContent;
            const conceitualStatus = document.getElementById('conceitual-status').textContent;
            const social = document.getElementById('social-score').textContent;
            const socialStatus = document.getElementById('social-status').textContent;
            const pratico = document.getElementById('pratico-score').textContent;
            const praticoStatus = document.getElementById('pratico-status').textContent;

            let respostasTexto = '';
            perguntas.forEach((p, i) => {
                if (respostas[i]) {
                    respostasTexto += `${i + 1}. ${respostas[i].toUpperCase()}\n`;
                }
            });

            const mensagem = `*ESCALA DE AVALIAÇÃO TDI*\n\n` +
                `*Nome:* ${nome}\n` +
                `*Idade:* ${idade}\n` +
                `*Data:* ${data}\n` +
                `*Respondente:* ${respondente}\n\n` +
                `*RESULTADOS:*\n` +
                `📊 Conceitual: ${conceitual} - ${conceitualStatus}\n` +
                `📊 Social: ${social} - ${socialStatus}\n` +
                `📊 Prático: ${pratico} - ${praticoStatus}\n\n` +
                `*RESPOSTAS:*\n${respostasTexto}`;

            const url = `https://wa.me/?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }

        renderPerguntas();
        document.getElementById('data').valueAsDate = new Date();

        // === MODO PAINEL ===
        var params = new URLSearchParams(window.location.search);
        if (params.get('d')) {
            _decodificarURL();
        } else if (params.get('print')) {
            var infoTec = document.querySelector('.info-tecnica');
            if (infoTec) infoTec.style.display = 'none';
            var btns = document.querySelectorAll('.btn-calcular, .btn-exportar, .btn-whatsapp, .btn-limpar');
            btns.forEach(function(b){ b.style.display = 'none'; });
            var resultados = document.getElementById('results') || document.getElementById('resultados');
            if (resultados) resultados.style.display = 'none';
            setTimeout(function(){ window.print(); }, 500);
        } else {
            window.location.href = 'https://setmonte.github.io/online/';
        }
    
// ===== MODO PAINEL (via link) =====
var _sessionInfo = null;
var _API_URL = 'https://ccdzxqdclufzryxzgtvq7t5wsi0javug.lambda-url.sa-east-1.on.aws';

function _decodificarURL() {
    var params = new URLSearchParams(window.location.search);
    var d = params.get('d');
    if (d) {
        try { _sessionInfo = JSON.parse(atob(decodeURIComponent(d))); } catch(e) { return false; }
        // Preencher dados do paciente vindos do painel
        var nomeEl = document.getElementById('nome');
        var nascEl = document.getElementById('dataNascimento') || document.getElementById('dn');
        var sexoEl = document.getElementById('sexo');
        if (nomeEl && _sessionInfo.patientName) nomeEl.value = _sessionInfo.patientName;
        if (nascEl && _sessionInfo.birthDate) nascEl.value = _sessionInfo.birthDate;
        if (sexoEl && _sessionInfo.sex) sexoEl.value = _sessionInfo.sex;
        // Calcular idade se funcao existir
        if (typeof calcularIdade === 'function') calcularIdade();
        // Disparar eventos para id-paciente.js recalcular
        if (nomeEl) nomeEl.dispatchEvent(new Event('input'));
        if (nascEl) nascEl.dispatchEvent(new Event('change'));
        // Trocar botoes — TDI nao tem div container, esconder botoes individuais
        var btns = document.querySelectorAll('.btn-calcular, .btn-exportar, .btn-whatsapp, .btn-limpar');
        btns.forEach(function(b){ b.style.display = 'none'; });
        // Inserir botao de envio
        var calcBtn = document.querySelector('.btn-calcular');
        if (calcBtn) {
            var enviarBtn = document.createElement('button');
            enviarBtn.className = 'btn-calcular';
            enviarBtn.style.cssText = 'background:linear-gradient(135deg,#2e7d32,#43a047);margin-top:20px;';
            enviarBtn.textContent = '\u{1F4E4} Enviar Resultados ao Profissional';
            enviarBtn.onclick = _enviarResultadosPainel;
            calcBtn.parentNode.insertBefore(enviarBtn, calcBtn);
        }
        // Esconder info tecnica
        var infoTec = document.querySelector('.info-tecnica');
        if (infoTec) infoTec.style.display = 'none';
        return true;
    }
    return false;
}

async function _enviarResultadosPainel() {
    // Validar nome preenchido
    var nomeEl = document.getElementById('nome') || document.getElementById('patientName') || document.getElementById('nomeFilho') || document.getElementById('crianca');
    if (nomeEl && !nomeEl.value.trim()) { alert('Preencha o nome antes de enviar.'); return; }
    // Coletar dados da escala (usa window._escalaDados se disponivel)
    var calcFn = window.calcularResultados || window.calcular;
    if (calcFn && !window._escalaDados) {
        try { calcFn(); } catch(e) {}
    }
    var dados = window._escalaDados || {};
    if (!dados.escala) dados.escala = document.title.replace(/[\s\u2014\u2013|].*/,'').trim();
    var idPaciente = '';
    var idEl = document.getElementById('idPaciente');
    if (idEl) idPaciente = idEl.value || '';
    dados.idPaciente = idPaciente;
    dados.data = new Date().toISOString();
    // Enviar
    var btn = document.querySelector('.botoes button') || document.querySelector('.actions button');
    if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
    try {
        var resp = await fetch(_API_URL + '/save-escala', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId: _sessionInfo.sessionId, email: _sessionInfo.email, data: dados })
        });
        var result = await resp.json();
        if (result.ok || resp.ok) {
            var container = document.querySelector('.botoes') || document.querySelector('.actions');
            if (container) container.innerHTML = '<div style="background:#c8e6c9;border:2px solid #2e7d32;border-radius:10px;padding:20px;text-align:center;"><p style="font-size:1.3em;color:#2e7d32;font-weight:bold;">\u2705 Resultados enviados com sucesso!</p><p style="color:#555;margin-top:8px;">O profissional ja pode visualizar seus resultados no painel.</p><p style="color:#777;margin-top:5px;font-size:0.85em;">Voce pode fechar esta pagina.</p></div>';
            // Esconder resultados visuais
            var res = document.getElementById('resultados') || document.querySelector('.resultados');
            if (res) res.style.display = 'none';
        } else {
            if (btn) { btn.disabled = false; btn.textContent = '\u{1F4E4} Enviar Resultados ao Profissional'; }
            alert('Erro ao enviar. Tente novamente.');
        }
    } catch(e) {
        if (btn) { btn.disabled = false; btn.textContent = '\u{1F4E4} Enviar Resultados ao Profissional'; }
        alert('Erro de conexao. Verifique sua internet e tente novamente.');
    }
}

    </script>

if (!new URLSearchParams(window.location.search).get('d')) {
  var s1 = document.createElement('script'); s1.src = 'pdf-escalas.js'; document.body.appendChild(s1);
  var s2 = document.createElement('script'); s2.src = 'salvar-escala.js'; document.body.appendChild(s2);
