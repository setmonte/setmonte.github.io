<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deixe sua Avaliação — Sérgio Teixeira Monte</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4a9bd9 0%, #6db3e8 30%, #87ceeb 60%, #a8d8f0 100%);
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 0.9rem;
            color: #666;
        }
        .stars-input {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
            direction: rtl;
        }
        .stars-input input { display: none; }
        .stars-input label {
            font-size: 2.2rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }
        .stars-input input:checked ~ label,
        .stars-input label:hover,
        .stars-input label:hover ~ label {
            color: #f5a623;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #4a9bd9;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .btn-enviar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4a9bd9, #6db3e8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-enviar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74,155,217,0.4);
        }
        .btn-enviar:disabled {
            background: #ccc;
            cursor: default;
            transform: none;
            box-shadow: none;
        }
        .msg {
            text-align: center;
            margin-top: 12px;
            font-size: 0.85rem;
            min-height: 20px;
        }
        .msg.ok { color: #2e7d32; }
        .msg.erro { color: #c62828; }
        .msg.info { color: #555; }
        .nota-privacidade {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #999;
            text-align: center;
            line-height: 1.4;
        }
        .sucesso {
            text-align: center;
            padding: 30px 0;
        }
        .sucesso .emoji { font-size: 3rem; margin-bottom: 15px; }
        .sucesso h2 { color: #2e7d32; margin-bottom: 10px; }
        .sucesso p { color: #555; font-size: 0.9rem; line-height: 1.5; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⭐ Deixe sua Avaliação</h1>
            <p>Sua opinião é muito importante para mim!</p>
        </div>

        <!-- FORMULÁRIO -->
        <form id="formDepoimento">
            <div class="stars-input">
                <input type="radio" id="star5" name="nota" value="5"><label for="star5">★</label>
                <input type="radio" id="star4" name="nota" value="4"><label for="star4">★</label>
                <input type="radio" id="star3" name="nota" value="3"><label for="star3">★</label>
                <input type="radio" id="star2" name="nota" value="2"><label for="star2">★</label>
                <input type="radio" id="star1" name="nota" value="1"><label for="star1">★</label>
            </div>

            <div class="form-group">
                <label for="nome">Seu nome (ou iniciais):</label>
                <input type="text" id="nome" placeholder="Ex: Maria S." required maxlength="50">
            </div>

            <div class="form-group">
                <label for="servico">Tipo de atendimento:</label>
                <select id="servico">
                    <option value="">Selecione (opcional)</option>
                    <option value="Avaliação Neuropsicológica">Avaliação Neuropsicológica</option>
                    <option value="Avaliação Psicológica">Avaliação Psicológica</option>
                    <option value="Psicoterapia">Psicoterapia</option>
                    <option value="Orientação Profissional">Orientação Profissional</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="texto">Seu depoimento:</label>
                <textarea id="texto" placeholder="Conte como foi sua experiência..." required minlength="20" maxlength="500"></textarea>
            </div>

            <button type="submit" class="btn-enviar" id="btnEnviar">Enviar Avaliação</button>
            <p class="msg" id="msg"></p>
        </form>

        <!-- SUCESSO -->
        <div id="sucesso" class="sucesso hidden">
            <div class="emoji">✅</div>
            <h2>Obrigado!</h2>
            <p>Sua avaliação foi enviada com sucesso e será publicada em breve.</p>
        </div>

        <p class="nota-privacidade">
            Seu depoimento será revisado automaticamente antes da publicação.
            Não inclua dados pessoais sensíveis (CPF, telefone, endereço).
        </p>
    </div>

    <script>
        var API = 'https://ccdzxqdclufzryxzgtvq7t5wsi0javug.lambda-url.sa-east-1.on.aws';

        document.getElementById('formDepoimento').addEventListener('submit', async function(e) {
            e.preventDefault();
            var msg = document.getElementById('msg');
            var btn = document.getElementById('btnEnviar');

            // Validar estrelas
            var nota = document.querySelector('input[name="nota"]:checked');
            if (!nota) { msg.textContent = 'Por favor, selecione uma nota (estrelas).'; msg.className = 'msg erro'; return; }

            var nome = document.getElementById('nome').value.trim();
            var texto = document.getElementById('texto').value.trim();
            var servico = document.getElementById('servico').value;

            if (texto.length < 20) { msg.textContent = 'O depoimento precisa ter pelo menos 20 caracteres.'; msg.className = 'msg erro'; return; }

            btn.disabled = true;
            btn.textContent = 'Enviando...';
            msg.textContent = 'Verificando seu depoimento...';
            msg.className = 'msg info';

            try {
                var resp = await fetch(API + '/save-depoimento', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: nome,
                        nota: parseInt(nota.value),
                        texto: texto,
                        servico: servico
                    })
                });
                var data = await resp.json();

                if (data.ok) {
                    document.getElementById('formDepoimento').classList.add('hidden');
                    document.getElementById('sucesso').classList.remove('hidden');
                    msg.textContent = '';
                } else {
                    msg.textContent = data.error || 'Não foi possível enviar. Tente novamente.';
                    msg.className = 'msg erro';
                    btn.disabled = false;
                    btn.textContent = 'Enviar Avaliação';
                }
            } catch(err) {
                msg.textContent = 'Erro de conexão. Tente novamente.';
                msg.className = 'msg erro';
                btn.disabled = false;
                btn.textContent = 'Enviar Avaliação';
            }
        });
    </script>
</body>
</html>
