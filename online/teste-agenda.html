<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prontuario IA - SYM</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QY1N9587DG"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-QY1N9587DG');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f6f2;--surface:#fff;--border:#e2e0d8;--text:#1c1b18;--text2:#6b6860;--text3:#9c9a94;--accent:#2d6a8f;--accent-light:#e8f2f8;--green:#2d7a4f;--green-light:#e8f5ee;--red:#b83232;--red-light:#fdf0f0;--radius:10px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.app{max-width:800px;margin:0 auto;padding:1.5rem 1rem}
.header{text-align:center;margin-bottom:1.5rem}
.header h1{font-size:20px;color:var(--accent);font-weight:600}
.header p{font-size:12px;color:var(--text3);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1rem}
.topico-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.topico-row input{flex:1;font-size:13px;height:32px;border:1px solid var(--border);border-radius:8px;padding:0 10px;background:var(--bg);outline:none}
.topico-row input:focus{border-color:var(--accent);background:#fff}
.topico-row button{width:26px;height:26px;border:1px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;color:var(--text3);font-size:13px;display:flex;align-items:center;justify-content:center}
.topico-row button:hover{background:var(--red-light);color:var(--red)}
.btn-add{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:5px 0;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#245a7a}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#1f5c3a}
.btn-outline{background:var(--surface);color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:var(--bg)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1 id="page-title">&#128203; Prontuario IA</h1>
<p>S&#233;rgio Teixeira Monte &#183; Neuropsic&#243;logo &#183; CRP 14/05739-9</p>
</div>
<div id="paciente-info"></div>
<div id="topicos-section"></div>
<div id="consulta-area"></div>
</div>
<script src="anonimizador.js"></script>
</body>
</html>

<script>
var API_URL = 'https://ccdzxqdclufzryxzgtvq7t5wsi0javug.lambda-url.sa-east-1.on.aws';
var sessionInfo = {};
var modoAgenda = false; // true = com timer/bips, false = modo livre
var gravando = false;
var pausado = false;
var timerInterval = null;
var segundosDecorridos = 0;
var totalSegundos = 0;
var bipDado10 = false;
var bipDadoFinal = false;
var recognition = null;
var transcricaoAcumulada = '';
var restartCount = 0;
var restartWindowStart = 0;
var MAX_RESTARTS = 5;
var RESTART_WINDOW = 10000;
var RESTART_DELAY = 300;
var topicosPadrao = ['Nome completo','Idade e data de nascimento','CPF','Nome do pai','Nome da mae','Queixa principal','Desenvolvimento na infancia','Desenvolvimento na adolescencia','Vida adulta','Historico familiar','Medicamentos em uso','Observacoes adicionais'];
var topicosAtuais = [];

// Decodificar dados da URL
function init() {
  var params = new URLSearchParams(window.location.search);
  var d = params.get('d');
  if (d) {
    // Modo agenda (vindo do painel com dados do paciente)
    try { sessionInfo = JSON.parse(atob(decodeURIComponent(d))); } catch(e) { try { sessionInfo = JSON.parse(atob(d)); } catch(e2) {} }
    if (!sessionInfo.email) { document.body.innerHTML = '<div style="text-align:center;padding:60px;"><h2 style="color:#c62828;">Erro ao decodificar dados.</h2></div>'; return; }
    modoAgenda = true;
    totalSegundos = (parseInt(sessionInfo.duracao) || 60) * 60;
    document.getElementById('page-title').innerHTML = '&#128203; Consulta em Andamento';
    renderPacienteInfo();
  } else {
    // Modo livre (acesso direto)
    modoAgenda = false;
    sessionInfo = { patientName: '', tipoConsulta: 'Livre', duracao: 0 };
    document.getElementById('page-title').innerHTML = '&#128203; Prontuario IA — Modo Livre';
    renderModoLivreInfo();
  }
  // Carregar topicos salvos ou usar padrao
  var saved = localStorage.getItem('prontuario_topicos');
  topicosAtuais = saved ? JSON.parse(saved) : (sessionInfo.topicos || topicosPadrao.slice());
  renderTopicos();
  renderConsultaArea();
}

function renderModoLivreInfo() {
  var el = document.getElementById('paciente-info');
  el.innerHTML = '<div class="card" style="background:var(--accent-light);border-color:#a8cce0;">' +
    '<div style="font-size:13px;color:var(--accent);">&#128161; <strong>Modo Livre</strong> — grave uma consulta, anamnese ou observacoes. Pare quando quiser.</div>' +
    '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">' +
    '<label style="font-size:12px;color:var(--text2);">Paciente (opcional): <input type="text" id="livre-nome" placeholder="Nome" style="height:30px;border:1px solid var(--border);border-radius:6px;padding:0 8px;font-size:13px;width:180px;margin-left:4px;"></label>' +
    '<label style="font-size:12px;color:var(--text2);">Tipo: <select id="livre-tipo" style="height:30px;border:1px solid var(--border);border-radius:6px;padding:0 8px;font-size:13px;margin-left:4px;"><option>Anamnese</option><option>Consulta</option><option>Observacoes</option><option>Devolutiva</option><option>Outro</option></select></label>' +
    '</div></div>';
}

function renderPacienteInfo() {
  var el = document.getElementById('paciente-info');
  el.innerHTML = '<div class="card" style="background:var(--accent-light);border-color:#a8cce0;">' +
    '<div style="display:flex;align-items:center;gap:12px;">' +
    '<div style="width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;">' + iniciais(sessionInfo.patientName || 'P') + '</div>' +
    '<div><div style="font-size:16px;font-weight:600;">' + (sessionInfo.patientName || 'Paciente') + '</div>' +
    '<div style="font-size:12px;color:var(--text2);">' + (sessionInfo.tipoConsulta || 'Consulta') + ' &mdash; ' + (sessionInfo.duracao || 60) + ' min</div></div></div></div>';
}

function iniciais(nome) { if (!nome) return 'P'; return nome.split(' ').map(function(p){return p[0]||'';}).slice(0,2).join('').toUpperCase(); }

// === TOPICOS EDITAVEIS ===
function renderTopicos() {
  var el = document.getElementById('topicos-section');
  var html = '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;"><span style="font-size:13px;font-weight:600;color:var(--accent);">&#128221; Topicos do Prontuario</span><button class="btn-add" onclick="toggleTopicos()" id="btn-toggle-topicos">editar</button></div>';
  html += '<div id="topicos-lista" style="display:none;">';
  topicosAtuais.forEach(function(t, i) {
    html += '<div class="topico-row"><input type="text" value="' + t.replace(/"/g,'&quot;') + '" onchange="atualizarTopico(' + i + ',this.value)"><button onclick="removerTopico(' + i + ')">&#10005;</button></div>';
  });
  html += '<button class="btn-add" onclick="adicionarTopico()">+ Adicionar topico</button></div>';
  html += '<div id="topicos-resumo" style="font-size:12px;color:var(--text3);line-height:1.8;">' + topicosAtuais.join(' &bull; ') + '</div>';
  html += '</div>';
  el.innerHTML = html;
}

function toggleTopicos() {
  var lista = document.getElementById('topicos-lista');
  var resumo = document.getElementById('topicos-resumo');
  var btn = document.getElementById('btn-toggle-topicos');
  if (lista.style.display === 'none') { lista.style.display = 'block'; resumo.style.display = 'none'; btn.textContent = 'fechar'; }
  else { lista.style.display = 'none'; resumo.style.display = 'block'; btn.textContent = 'editar'; salvarTopicos(); }
}

function atualizarTopico(i, val) { topicosAtuais[i] = val; }
function removerTopico(i) { topicosAtuais.splice(i, 1); salvarTopicos(); renderTopicos(); }
function adicionarTopico() { topicosAtuais.push('Novo topico'); salvarTopicos(); renderTopicos(); toggleTopicos(); }
function salvarTopicos() { localStorage.setItem('prontuario_topicos', JSON.stringify(topicosAtuais)); }

// === AREA DE GRAVACAO ===
function renderConsultaArea() {
  var el = document.getElementById('consulta-area');
  var timerHTML = '';
  if (modoAgenda) {
    timerHTML = '<div style="text-align:center;padding:1rem 0;">' +
      '<div id="timer-display" style="font-size:56px;font-weight:300;color:var(--text);letter-spacing:-2px;font-variant-numeric:tabular-nums;">' + fmtTempo(totalSegundos) + '</div>' +
      '<div style="font-size:12px;color:var(--text3);margin-top:4px;" id="timer-label">Tempo restante</div>' +
      '<div style="height:8px;background:#e8e8e8;border-radius:4px;margin:12px 0;overflow:hidden;"><div id="progress-bar" style="height:100%;width:0%;background:var(--accent);border-radius:4px;transition:width 1s linear;"></div></div></div>';
  } else {
    timerHTML = '<div style="text-align:center;padding:1rem 0;">' +
      '<div id="timer-display" style="font-size:56px;font-weight:300;color:var(--text);letter-spacing:-2px;font-variant-numeric:tabular-nums;">00:00</div>' +
      '<div style="font-size:12px;color:var(--text3);margin-top:4px;" id="timer-label">Tempo decorrido</div></div>';
  }
  el.innerHTML = '<div id="step-gravacao">' + timerHTML +
    '<div style="text-align:center;margin-bottom:1.5rem;">' +
    '<button id="btn-gravar" onclick="toggleGravacao()" style="width:72px;height:72px;border-radius:50%;background:#fff0f0;border:2px solid #f09595;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:28px;transition:all 0.2s;">&#127908;</button>' +
    '<button id="btn-pausar" onclick="togglePausa()" style="width:52px;height:52px;border-radius:50%;background:#fff8e1;border:2px solid #ffcc80;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:20px;transition:all 0.2s;margin-left:12px;vertical-align:middle;">&#9208;</button>' +
    '<div id="status-gravacao" style="font-size:12px;color:var(--text3);margin-top:8px;">Clique para iniciar a gravacao</div></div>' +
    '<div style="margin-bottom:1rem;"><label style="font-size:12px;font-weight:500;color:var(--text2);">Transcricao:</label>' +
    '<textarea id="transcricao" style="width:100%;min-height:120px;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;font-family:inherit;resize:vertical;margin-top:6px;" placeholder="A transcricao aparecera aqui... Voce tambem pode colar texto manualmente."></textarea></div>' +
    '<div style="text-align:center;margin-top:1rem;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">' +
    '<button id="btn-gerar" onclick="gerarProntuario()" class="btn btn-primary">&#10024; Gerar Prontuario por Topicos</button></div></div>' +
    '<div id="step-prontuario" style="display:none;"></div>';
}

function fmtTempo(s) { var m = Math.floor(s / 60); var sec = s % 60; return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0'); }

function toggleGravacao() { gravando ? pararGravacao() : iniciarGravacao(); }

function togglePausa() {
  if (!gravando) return;
  if (pausado) {
    // Retomar gravacao
    pausado = false;
    document.getElementById('btn-pausar').innerHTML = '&#9208;';
    document.getElementById('btn-pausar').style.background = '#fff8e1';
    document.getElementById('btn-pausar').style.borderColor = '#ffcc80';
    document.getElementById('status-gravacao').textContent = 'Gravando... clique para parar';
    // Retomar reconhecimento de voz
    restartCount = 0;
    restartWindowStart = Date.now();
    if (recognition) { try { recognition.start(); } catch(e){} }
    if (window._fallbackMediaRecorder && window._fallbackMediaRecorder.state === 'paused') {
      try { window._fallbackMediaRecorder.resume(); } catch(e) {}
    }
    // Retomar timer
    timerInterval = setInterval(function() {
      segundosDecorridos++;
      if (modoAgenda) {
        var restante = totalSegundos - segundosDecorridos;
        if (restante < 0) restante = 0;
        document.getElementById('timer-display').textContent = fmtTempo(restante);
        var pct = (segundosDecorridos / totalSegundos) * 100;
        if (pct > 100) pct = 100;
        document.getElementById('progress-bar').style.width = pct + '%';
        if (restante <= 600) { document.getElementById('timer-display').style.color = '#e24b4a'; document.getElementById('progress-bar').style.background = '#e24b4a'; }
        if (!bipDado10 && restante <= 600 && restante > 0) { bipDado10 = true; emitirBip(1); document.getElementById('timer-label').textContent = '10 minutos restantes!'; }
        if (!bipDadoFinal && restante <= 0) { bipDadoFinal = true; emitirBip(2); document.getElementById('timer-label').textContent = 'Tempo esgotado!'; setTimeout(function() { pararGravacao(); }, 1500); }
      } else {
        document.getElementById('timer-display').textContent = fmtTempo(segundosDecorridos);
      }
    }, 1000);
  } else {
    // Pausar gravacao
    pausado = true;
    document.getElementById('btn-pausar').innerHTML = '&#9654;';
    document.getElementById('btn-pausar').style.background = '#e8f5e9';
    document.getElementById('btn-pausar').style.borderColor = '#4caf50';
    document.getElementById('status-gravacao').textContent = 'Pausado. Clique &#9654; para retomar.';
    // Pausar reconhecimento de voz
    if (recognition) { try { recognition.stop(); } catch(e){} }
    if (window._fallbackMediaRecorder && window._fallbackMediaRecorder.state === 'recording') {
      try { window._fallbackMediaRecorder.pause(); } catch(e) {}
    }
    // Pausar timer
    clearInterval(timerInterval);
  }
}

async function iniciarGravacao() {
  // Verificar credito antes de iniciar
  if (sessionInfo && sessionInfo.email && sessionInfo.email !== 'setmonte@gmail.com') {
    try {
      var _cr = await fetch(API_URL + '/use-credit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: sessionInfo.email, tipo: 'prontuario'})
      });
      if (_cr.status === 403) {
        alert('Creditos insuficientes. Consulte seu avaliador.');
        return;
      }
    } catch(e) {}
  }
  gravando = true;
  pausado = false;
  segundosDecorridos = 0;
  bipDado10 = false;
  bipDadoFinal = false;
  transcricaoAcumulada = '';
  restartCount = 0;
  restartWindowStart = Date.now();
  document.getElementById('btn-gravar').style.background = '#e24b4a';
  document.getElementById('btn-gravar').style.borderColor = '#e24b4a';
  document.getElementById('btn-gravar').innerHTML = '&#9632;';
  document.getElementById('btn-gravar').style.color = '#fff';
  document.getElementById('btn-pausar').style.display = 'inline-flex';
  document.getElementById('btn-pausar').innerHTML = '&#9208;';
  document.getElementById('btn-pausar').style.background = '#fff8e1';
  document.getElementById('btn-pausar').style.borderColor = '#ffcc80';
  document.getElementById('status-gravacao').textContent = 'Gravando... clique para parar';
  // Iniciar Speech Recognition
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    recognition = new SR();
    recognition.lang = 'pt-BR';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = function(e) {
      restartCount = 0;
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) transcricaoAcumulada += e.results[i][0].transcript + ' ';
        else interim = e.results[i][0].transcript;
      }
      document.getElementById('transcricao').value = transcricaoAcumulada + interim;
    };
    recognition.onerror = function(e) { document.getElementById('status-gravacao').textContent = 'Erro: ' + e.error + '. Verifique permissao do microfone.'; };
    recognition.onend = function() {
      if (gravando && !pausado) {
        var agora = Date.now();
        if (agora - restartWindowStart > RESTART_WINDOW) {
          restartCount = 0;
          restartWindowStart = agora;
        }
        restartCount++;
        if (restartCount > MAX_RESTARTS) {
          document.getElementById('status-gravacao').textContent = 'Reconhecimento de voz reiniciou muitas vezes. Clique no microfone para tentar novamente.';
          document.getElementById('btn-gravar').style.background = '#fff3e0';
          document.getElementById('btn-gravar').style.borderColor = '#ff9800';
          document.getElementById('btn-gravar').innerHTML = '&#127908;';
          document.getElementById('btn-gravar').style.color = '#ff9800';
          gravando = false;
          return;
        }
        setTimeout(function() {
          if (gravando && !pausado) {
            try { recognition.start(); } catch(er) {}
          }
        }, RESTART_DELAY);
      }
    };
    recognition.start();
  } else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    // FALLBACK: usar MediaRecorder + Whisper API para navegadores sem SpeechRecognition
    document.getElementById('status-gravacao').textContent = 'Transcrevendo via IA (pode haver delay de alguns segundos)...';
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
      var mimeType = 'audio/webm;codecs=opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'audio/webm';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          mimeType = 'audio/ogg;codecs=opus';
          if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = '';
          }
        }
      }
      if (!mimeType) {
        document.getElementById('status-gravacao').textContent = 'Navegador nao suporta gravacao de audio. Cole o texto manualmente.';
        gravando = false;
        return;
      }
      var mediaRec = new MediaRecorder(stream, { mimeType: mimeType });
      window._fallbackMediaRecorder = mediaRec;
      window._fallbackStream = stream;
      var chunkQueue = [];
      var enviando = false;
      var chunkCounter = 0;
      
      mediaRec.ondataavailable = function(e) {
        if (e.data.size > 0 && gravando && !pausado) {
          chunkQueue.push(e.data);
          processarFilaChunks();
        }
      };
      
      function processarFilaChunks() {
        if (enviando || chunkQueue.length === 0) return;
        enviando = true;
        var chunk = chunkQueue.shift();
        chunkCounter++;
        var chunkId = (sessionInfo.sessionId || 'prontuario') + '-chunk' + chunkCounter;
        var reader = new FileReader();
        reader.onloadend = function() {
          var base64 = reader.result.split(',')[1] || '';
          if (base64.length < 100) {
            enviando = false;
            processarFilaChunks();
            return;
          }
          var tentativas = 0;
          function tentarTranscrever() {
            tentativas++;
            fetch(API_URL + '/transcribe-audio', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ audioBase64: base64, sessionId: chunkId })
            }).then(function(resp) {
              return resp.json();
            }).then(function(data) {
              if (data.text && data.text.trim()) {
                transcricaoAcumulada += data.text.trim() + ' ';
                document.getElementById('transcricao').value = transcricaoAcumulada;
              }
              enviando = false;
              processarFilaChunks();
            }).catch(function() {
              if (tentativas < 2) {
                setTimeout(tentarTranscrever, 2000);
              } else {
                enviando = false;
                processarFilaChunks();
              }
            });
          }
          tentarTranscrever();
        };
        reader.readAsDataURL(chunk);
      }
      
      mediaRec.start(5000); // Gravar em chunks de 5 segundos
    }).catch(function(err) {
      document.getElementById('status-gravacao').textContent = 'Erro ao acessar microfone: ' + err.message;
      gravando = false;
    });
  } else {
    document.getElementById('status-gravacao').textContent = 'Navegador nao suporta gravacao. Cole o texto manualmente na caixa abaixo.';
    gravando = false; return;
  }
  // Timer
  timerInterval = setInterval(function() {
    segundosDecorridos++;
    if (modoAgenda) {
      var restante = totalSegundos - segundosDecorridos;
      if (restante < 0) restante = 0;
      document.getElementById('timer-display').textContent = fmtTempo(restante);
      var pct = (segundosDecorridos / totalSegundos) * 100;
      if (pct > 100) pct = 100;
      document.getElementById('progress-bar').style.width = pct + '%';
      if (restante <= 600) { document.getElementById('timer-display').style.color = '#e24b4a'; document.getElementById('progress-bar').style.background = '#e24b4a'; }
      if (!bipDado10 && restante <= 600 && restante > 0) { bipDado10 = true; emitirBip(1); document.getElementById('timer-label').textContent = '10 minutos restantes!'; }
      if (!bipDadoFinal && restante <= 0) { bipDadoFinal = true; emitirBip(2); document.getElementById('timer-label').textContent = 'Tempo esgotado!'; setTimeout(function() { pararGravacao(); }, 1500); }
    } else {
      document.getElementById('timer-display').textContent = fmtTempo(segundosDecorridos);
    }
  }, 1000);
}

function pararGravacao() {
  gravando = false;
  pausado = false;
  if (recognition) { try { recognition.stop(); } catch(e){} }
  if (window._fallbackMediaRecorder) {
    try { window._fallbackMediaRecorder.stop(); } catch(e) {}
    window._fallbackMediaRecorder = null;
  }
  if (window._fallbackStream) {
    window._fallbackStream.getTracks().forEach(function(t) { t.stop(); });
    window._fallbackStream = null;
  }
  clearInterval(timerInterval);
  document.getElementById('btn-gravar').style.background = '#fff0f0';
  document.getElementById('btn-gravar').style.borderColor = '#f09595';
  document.getElementById('btn-gravar').innerHTML = '&#127908;';
  document.getElementById('btn-gravar').style.color = '#e24b4a';
  document.getElementById('btn-pausar').style.display = 'none';
  document.getElementById('status-gravacao').textContent = 'Gravacao encerrada. Edite a transcricao se necessario.';
  if (!document.getElementById('transcricao').value.trim()) {
    document.getElementById('transcricao').value = transcricaoAcumulada;
  }
}

function emitirBip(vezes) {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (var i = 0; i < vezes; i++) {
      (function(delay) {
        setTimeout(function() {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 880; osc.type = 'sine'; gain.gain.value = 0.3;
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
        }, delay);
      })(i * 500);
    }
  } catch(e) {}
}

async function gerarProntuario() {
  var transcricao = document.getElementById('transcricao').value.trim();
  if (!transcricao) { alert('A transcricao esta vazia. Grave ou cole o texto.'); return; }
  // Atualizar nome do paciente se modo livre
  if (!modoAgenda) {
    var nomeEl = document.getElementById('livre-nome');
    var tipoEl = document.getElementById('livre-tipo');
    if (nomeEl) sessionInfo.patientName = nomeEl.value.trim() || 'Paciente';
    if (tipoEl) sessionInfo.tipoConsulta = tipoEl.value;
  }
  var btn = document.getElementById('btn-gerar');
  btn.disabled = true; btn.textContent = 'Analisando...';
  var stepPront = document.getElementById('step-prontuario');
  stepPront.style.display = 'block';
  stepPront.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3);">Gerando prontuario por topicos...</div>';
  try {
    // === ANONIMIZACAO INVISIVEL ===
    var contextoAnon = { paciente: sessionInfo.patientName || '' };
    var anonResult = (typeof Anonimizador !== 'undefined') ? Anonimizador.mascarar(transcricao, contextoAnon) : { textoLimpo: transcricao, mapa: {} };
    var transcricaoSegura = anonResult.textoLimpo;
    var mapaAnon = anonResult.mapa;
    // === FIM ANONIMIZACAO ===
    var resp = await fetch(API_URL + '/generate-prontuario', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ transcricao: transcricaoSegura, topicos: topicosAtuais, tipoSessao: sessionInfo.tipoConsulta || '' })
    });
    var data = await resp.json();
    if (data.error) throw new Error(data.error);
    var resultados = data.resultados || [];
    // === DESANONIMIZACAO INVISIVEL ===
    if (typeof Anonimizador !== 'undefined' && mapaAnon && Object.keys(mapaAnon).length > 0) {
      resultados = resultados.map(function(r) {
        return { topico: r.topico, conteudo: Anonimizador.desmascarar(r.conteudo || '', mapaAnon) };
      });
    }
    // === FIM DESANONIMIZACAO ===
    renderProntuario(resultados);
  } catch(e) {
    stepPront.innerHTML = '<div style="background:var(--red-light);border:1px solid #e8a8a8;border-radius:8px;padding:12px;color:var(--red);">Erro: ' + e.message + '</div>';
    btn.disabled = false; btn.textContent = '&#10024; Tentar novamente';
  }
}

function renderProntuario(resultados) {
  var stepPront = document.getElementById('step-prontuario');
  var html = '<div style="margin-top:1.5rem;"><div style="font-size:14px;font-weight:600;color:var(--accent);margin-bottom:12px;">Prontuario Clinico <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--green-light);color:var(--green);border-radius:6px;padding:2px 8px;margin-left:8px;font-weight:400;">IA</span></div>';
  html += '<div style="display:flex;flex-direction:column;gap:8px;">';
  resultados.forEach(function(r) {
    html += '<div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;">' +
      '<div style="background:#f0efe9;padding:7px 12px;font-size:12px;font-weight:500;color:var(--text2);border-bottom:1px solid var(--border);">' + r.topico + '</div>' +
      '<div contenteditable="true" class="prontuario-conteudo" style="padding:10px 12px;font-size:13px;line-height:1.6;min-height:34px;outline:none;white-space:pre-wrap;">' + (r.conteudo || 'nao mencionado') + '</div></div>';
  });
  html += '</div>';
  html += '<div style="display:flex;gap:8px;margin-top:1.5rem;justify-content:center;flex-wrap:wrap;">';
  html += '<button onclick="salvarNoBanco()" class="btn btn-primary" id="btn-salvar-banco">&#128190; Salvar no Sistema</button>';
  html += '<button onclick="gerarPDF()" class="btn btn-green">&#128196; Gerar PDF</button>';
  html += '<button onclick="salvarComoHTML()" class="btn btn-outline">&#128190; Salvar .html</button>';
  html += '<button onclick="copiarTudo()" class="btn btn-outline">&#128203; Copiar Texto</button>';
  html += '<button onclick="gerarNovamente()" class="btn btn-outline">&#128260; Gerar Novamente</button>';
  html += '</div></div>';
  stepPront.innerHTML = html;
}

function gerarNovamente() {
  document.getElementById('step-prontuario').style.display = 'none';
  var btn = document.getElementById('btn-gerar');
  btn.disabled = false; btn.innerHTML = '&#10024; Gerar Prontuario por Topicos';
}

function salvarComoHTML() {
  var conteudos = document.querySelectorAll('.prontuario-conteudo');
  var topicosEl = document.querySelectorAll('#step-prontuario div[style*="background:#f0efe9"]');
  var corpo = '';
  topicosEl.forEach(function(el, i) {
    var conteudo = conteudos[i] ? conteudos[i].textContent : '';
    corpo += '<div style="margin-bottom:15px;"><div style="background:#f0f7fa;padding:8px 12px;border-left:3px solid #2d6a8f;font-weight:600;font-size:13px;color:#2d6a8f;margin-bottom:4px;">' + el.textContent + '</div><div style="padding:4px 12px;font-size:14px;line-height:1.7;color:#333;">' + conteudo + '</div></div>';
  });
  var dataAtual = new Date().toLocaleDateString('pt-BR');
  var horaAtual = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  var nomePac = sessionInfo.patientName || 'Paciente';
  var htmlDoc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Prontuario - ' + nomePac + '</title>' +
    '<style>body{font-family:"Segoe UI",sans-serif;max-width:700px;margin:0 auto;padding:30px 20px;color:#333;} ' +
    '.header{border-bottom:2px solid #2d6a8f;padding-bottom:15px;margin-bottom:20px;} ' +
    '.header h1{font-size:18px;color:#2d6a8f;margin:0;} .header p{font-size:12px;color:#666;margin:4px 0 0;} ' +
    '.info{display:flex;gap:20px;flex-wrap:wrap;background:#f7f6f2;padding:12px;border-radius:8px;margin-bottom:20px;font-size:13px;} ' +
    '.btn-print{display:block;text-align:center;margin-top:30px;} ' +
    '@media print{.btn-print{display:none !important;}}</style></head><body>' +
    '<div class="header"><h1>Prontuario Clinico</h1>' +
    '<p>Sergio Teixeira Monte - Neuropsicologo - CRP 14/05739-9</p></div>' +
    '<div class="info"><span><strong>Paciente:</strong> ' + nomePac + '</span>' +
    '<span><strong>Tipo:</strong> ' + (sessionInfo.tipoConsulta || 'Livre') + '</span>' +
    '<span><strong>Data:</strong> ' + dataAtual + '</span>' +
    (modoAgenda ? '<span><strong>Duracao:</strong> ' + (sessionInfo.duracao||60) + ' min</span>' : '<span><strong>Duracao real:</strong> ' + fmtTempo(segundosDecorridos) + '</span>') +
    '<span><strong>Tempo total da transcricao:</strong> ' + fmtTempo(segundosDecorridos) + '</span></div>' +
    corpo +
    '<div class="btn-print"><button onclick="window.print()" style="padding:10px 20px;background:#2d6a8f;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">Imprimir / Salvar PDF</button></div>' +
    '<div style="text-align:center;margin-top:30px;font-size:11px;color:#aaa;">Gerado em ' + dataAtual + ' as ' + horaAtual + ' | SYM Prontuario IA</div>' +
    '</body></html>';
  var blob = new Blob([htmlDoc], {type: 'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'Prontuario_' + nomePac.replace(/\s+/g,'_') + '_' + new Date().toISOString().split('T')[0] + '.html';
  a.click(); URL.revokeObjectURL(url);
  // Se modo agenda, salvar metadados
  if (modoAgenda) salvarMetadados();
}

async function salvarMetadados() {
  if (!sessionInfo.email || !sessionInfo.sessionId) return;
  try {
    await fetch(API_URL + '/save-result', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        email: sessionInfo.email, tipo: 'agenda', sessionId: sessionInfo.sessionId,
        data: { status: 'finalizado', date: new Date().toISOString(),
          formData: { nome: sessionInfo.patientName||'', tipoConsulta: sessionInfo.tipoConsulta||'', duracao: parseInt(sessionInfo.duracao)||60, duracaoReal: Math.floor(segundosDecorridos/60), horaConsulta: sessionInfo.hora||'', dataConsulta: new Date().toISOString().split('T')[0], pacienteId: sessionInfo.pacienteId||'', obs: sessionInfo.obs||'' }
        }
      })
    });
  } catch(e) {}
  document.getElementById('consulta-area').innerHTML += '<div style="background:var(--green-light);border:2px solid var(--green);border-radius:10px;padding:20px;text-align:center;margin-top:1.5rem;"><p style="font-size:1.2em;color:var(--green);font-weight:bold;">&#10004; Prontuario salvo e consulta finalizada!</p><p style="color:#555;margin-top:8px;">O arquivo .html foi salvo no seu computador.</p></div>';
}

function copiarTudo() {
  var conteudos = document.querySelectorAll('.prontuario-conteudo');
  var topicosEl = document.querySelectorAll('#step-prontuario div[style*="background:#f0efe9"]');
  var texto = '';
  topicosEl.forEach(function(el, i) { texto += el.textContent + ':\n' + (conteudos[i] ? conteudos[i].textContent : '') + '\n\n'; });
  navigator.clipboard.writeText(texto).then(function() { alert('Copiado para a area de transferencia!'); });
}

// === SALVAR NO BANCO (DynamoDB) ===
async function salvarNoBanco() {
  var btn = document.getElementById('btn-salvar-banco');
  if (!btn) return;
  // Coletar dados do prontuario gerado
  var conteudos = document.querySelectorAll('.prontuario-conteudo');
  var topicosEl = document.querySelectorAll('#step-prontuario div[style*="background:#f0efe9"]');
  var resumo = [];
  topicosEl.forEach(function(el, i) {
    resumo.push({ topico: el.textContent, conteudo: conteudos[i] ? conteudos[i].textContent : '' });
  });
  var transcricao = document.getElementById('transcricao').value.trim();
  var emailAvaliador = sessionInfo.email || '';
  // Fallback: tentar pegar email do sessionStorage (se veio do painel)
  if (!emailAvaliador) {
    try { emailAvaliador = sessionStorage.getItem('tecfe_user_email') || ''; } catch(e) {}
  }
  var pacienteId = sessionInfo.pacienteId || '';
  var pacienteNome = sessionInfo.patientName || 'Paciente';
  var tipoConsulta = sessionInfo.tipoConsulta || 'Consulta';
  var agendaSessionId = sessionInfo.sessionId || '';
  if (!emailAvaliador) {
    alert('Erro: email do avaliador nao encontrado. Salve como HTML por enquanto.');
    return;
  }
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    var resp = await fetch(API_URL + '/save-prontuario', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        email: emailAvaliador,
        pacienteId: pacienteId,
        pacienteNome: pacienteNome,
        tipoConsulta: tipoConsulta,
        topicos: topicosAtuais,
        resumo: resumo,
        transcricao: transcricao,
        agendaSessionId: agendaSessionId
      })
    });
    var data = await resp.json();
    if (data.ok) {
      btn.style.background = 'var(--green)';
      btn.textContent = 'Salvo no sistema!';
      btn.disabled = true;
      // Marcar consulta como finalizada se modo agenda
      if (modoAgenda) salvarMetadados();
    } else {
      throw new Error(data.error || 'Erro desconhecido');
    }
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Salvar no Sistema';
    alert('Erro ao salvar: ' + e.message);
  }
}

// === GERAR PDF (jsPDF) ===
function gerarPDF() {
  var conteudos = document.querySelectorAll('.prontuario-conteudo');
  var topicosEl = document.querySelectorAll('#step-prontuario div[style*="background:#f0efe9"]');
  if (!topicosEl.length) { alert('Gere o prontuario primeiro.'); return; }
  var jsPDF = window.jspdf ? window.jspdf.jsPDF : null;
  if (!jsPDF) {
    // Carregar jsPDF se ainda nao carregou
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = function() { gerarPDF(); };
    document.head.appendChild(s);
    return;
  }
  var doc = new jsPDF('p','mm','a4');
  var nomePac = sessionInfo.patientName || 'Paciente';
  var dataAtual = new Date().toLocaleDateString('pt-BR');
  var horaAtual = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  var pageW = doc.internal.pageSize.getWidth();
  var marginL = 15, marginR = 15, maxW = pageW - marginL - marginR;
  var y = 15;
  // Cabecalho
  doc.setFillColor(45, 106, 143);
  doc.rect(0, 0, pageW, 28, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(16);
  doc.text('Prontuario Clinico', marginL, 12);
  doc.setFontSize(10);
  doc.text('Sergio Teixeira Monte - Neuropsicologo - CRP 14/05739-9', marginL, 20);
  y = 36;
  // Dados do paciente
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(10);
  doc.setFont(undefined, 'bold');
  doc.text('Paciente: ', marginL, y);
  doc.setFont(undefined, 'normal');
  doc.text(nomePac, marginL + 22, y);
  y += 6;
  doc.setFont(undefined, 'bold');
  doc.text('Tipo: ', marginL, y);
  doc.setFont(undefined, 'normal');
  doc.text(sessionInfo.tipoConsulta || 'Consulta', marginL + 14, y);
  doc.setFont(undefined, 'bold');
  doc.text('Data: ', marginL + 80, y);
  doc.setFont(undefined, 'normal');
  doc.text(dataAtual, marginL + 93, y);
  y += 6;
  if (modoAgenda) {
    doc.setFont(undefined, 'bold');
    doc.text('Duracao: ', marginL, y);
    doc.setFont(undefined, 'normal');
    doc.text((sessionInfo.duracao || 60) + ' min', marginL + 20, y);
  } else {
    doc.setFont(undefined, 'bold');
    doc.text('Duracao real: ', marginL, y);
    doc.setFont(undefined, 'normal');
    doc.text(fmtTempo(segundosDecorridos), marginL + 28, y);
  }
  y += 6;
  doc.setFont(undefined, 'bold');
  doc.text('Tempo total da transcricao: ', marginL, y);
  doc.setFont(undefined, 'normal');
  doc.text(fmtTempo(segundosDecorridos), marginL + 56, y);
  y += 10;
  // Linha separadora
  doc.setDrawColor(200, 200, 200);
  doc.line(marginL, y, pageW - marginR, y);
  y += 8;
  // Topicos
  topicosEl.forEach(function(el, i) {
    var titulo = el.textContent;
    var conteudo = conteudos[i] ? conteudos[i].textContent : 'nao mencionado';
    // Verificar se precisa nova pagina
    if (y > 260) { doc.addPage(); y = 20; }
    // Titulo do topico
    doc.setFillColor(240, 247, 250);
    doc.rect(marginL, y - 4, maxW, 7, 'F');
    doc.setDrawColor(45, 106, 143);
    doc.line(marginL, y - 4, marginL, y + 3);
    doc.setFont(undefined, 'bold');
    doc.setFontSize(10);
    doc.setTextColor(45, 106, 143);
    doc.text(titulo, marginL + 3, y + 1);
    y += 9;
    // Conteudo
    doc.setFont(undefined, 'normal');
    doc.setFontSize(9);
    doc.setTextColor(51, 51, 51);
    var linhas = doc.splitTextToSize(conteudo, maxW - 4);
    linhas.forEach(function(linha) {
      if (y > 275) { doc.addPage(); y = 20; }
      doc.text(linha, marginL + 3, y);
      y += 4.5;
    });
    y += 5;
  });
  // Rodape
  var totalPages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    doc.setFontSize(8);
    doc.setTextColor(150, 150, 150);
    doc.text('Gerado em ' + dataAtual + ' as ' + horaAtual + ' | SYM Prontuario IA', marginL, 290);
    doc.text('Pagina ' + p + '/' + totalPages, pageW - marginR - 20, 290);
  }
  // Salvar
  var nomeArquivo = 'Prontuario_' + nomePac.replace(/\s+/g, '_') + '_' + new Date().toISOString().split('T')[0] + '.pdf';
  doc.save(nomeArquivo);
}

// Inicializar
init();
</script>
