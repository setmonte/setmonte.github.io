<style>

/* O botao SAIR do controlador fica fixo no canto inferior esquerdo (76 x 38 px): deixa espaco para ele nao cobrir o conteudo */

<script>
/* ============================================================
   BAFC - MODULO B: VELOCIDADE DE PROCESSAMENTO E ATENCAO
   35 estimulos espalhados (posicoes fixas, uma disposicao por etapa) em 4 etapas: pares, impares, estrela de 5 pontas, vermelho.
   Dificuldade: numeros de 2 algarismos (a paridade depende so do ultimo), estrelas de 4 pontas como
   isca da figura-alvo e laranja/rosa como iscas da cor-alvo (discriminacao fina e controle inibitorio).
   Mede por etapa: tempo, acertos, erros de comissao (cliques errados) e omissao (alvos nao tocados).
   IEP = (acertos / segundos) x (1 - taxa de erros), somando as 4 etapas (Manual, Etapa 1).
   ============================================================ */
/* ===== BAFC - codigo comum dos modulos (ASCII puro; textos acentuados via \u escapes) ===== */
/* --- Integracao com o controlador (o "sino") --- */
var BAFC_MOD = { bateria: false, id: '', paciente: {} };
(function () {
    var p = new URLSearchParams(window.location.search);
    if (p.get('bateria') === '1') {
        BAFC_MOD.bateria = true; BAFC_MOD.id = p.get('modulo') || '';
        try { BAFC_MOD.paciente = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(p.get('p')))))); } catch (e) { BAFC_MOD.paciente = {}; }
    }
})();
function bafcFim(dados) {
    if (!BAFC_MOD.bateria) { return; }
    try { window.parent.postMessage({ tipo: 'bafc-modulo-fim', modulo: BAFC_MOD.id, dados: dados }, '*'); } catch (e) {}
}
/* --- Telas --- */
function mostrarTela(id) {
    var ts = document.querySelectorAll('.tela');
    for (var i = 0; i < ts.length; i++) { ts[i].classList.remove('ativa'); }
    document.getElementById(id).classList.add('ativa');
    window.scrollTo(0, 0);
}
/* --- Audio (arquivos em ../audio/) --- */
var _aud = null;
function pararAudio() { if (_aud) { try { _aud.onended = null; _aud.onerror = null; _aud.pause(); } catch (e) {} _aud = null; } }
var _falaAvisada = false;
/* avisa o controlador na PRIMEIRA fala da bateria (marca o inicio do tempo total) */
function avisarPrimeiraFala() {
    if (_falaAvisada) { return; } _falaAvisada = true;
    if (!BAFC_MOD.bateria) { return; }
    try { window.parent.postMessage({ tipo: 'bafc-primeira-fala', modulo: BAFC_MOD.id, t: Date.now() }, '*'); } catch (e) {}
}
function tocarAudio(nome, aoTerminar) {
    avisarPrimeiraFala();
    pararAudio();
    var a = new Audio('../audio/' + nome + '.mp3');
    _aud = a;
    var fim = function () { if (_aud === a) { _aud = null; } if (aoTerminar) { var f = aoTerminar; aoTerminar = null; f(); } };
    a.onended = fim; a.onerror = fim;
    var p = a.play();
    if (p && p.catch) { p.catch(function () { fim(); }); }
    return a;
}
/* --- Tela de instrucao (texto + audio + botao) --- */
var _instrCb = null; var _instrFala = ''; var _instrT = 0;
function mostrarInstrucao(idFala, texto, rotulo, aoContinuar) {
    _instrCb = aoContinuar; _instrFala = idFala; _instrT = Date.now();
    document.getElementById('instrTexto').textContent = texto;
    document.getElementById('btnInstrOk').textContent = rotulo;
    mostrarTela('tela-instr');
    tocarAudio(idFala, null);
}
function instrOuvir() { tocarAudio(_instrFala, null); }
function instrContinuar() { if (Date.now() - _instrT < 900) { return; }   /* duplo toque nao pula a explicacao */
    pararAudio(); var f = _instrCb; _instrCb = null; if (f) { f(); } }
function fmtSeg(ms) { return (Math.round(ms / 100) / 10).toString().replace('.', ','); }
/* Aviso discreto de coleta anonima na tela inicial de cada modulo (padrao do site) */
(function () {
    var t = document.getElementById('tela-inicio'); if (!t) { return; }
    var p = document.createElement('p'); p.className = 'rodape-info';
    p.textContent = 'Dados an\u00f4nimos e n\u00e3o-identific\u00e1veis podem ser utilizados para fins de pesquisa e normatiza\u00e7\u00e3o.';
    t.appendChild(p);
})();


/* ---------- 1. DADOS ---------- */
/* 0 = vermelho (alvo); 5 = laranja e 6 = rosa sao as iscas parecidas */
var CORES = ['#e53935', '#1e88e5', '#43a047', '#fdd835', '#8e24aa', '#fb8c00', '#ec407a'];
/* 0 = estrela de 5 pontas (alvo); 5 = estrela de 4 pontas (isca parecida) */
var FORMAS = ['estrela', 'circulo', 'quadrado', 'triangulo', 'losango', 'estrela4'];
var LINHAS = 5, COLUNAS = 7;   /* so para contar: 35 figuras por etapa */
/* Posicoes das figuras (gerado por gerar_layouts_velocidade.js; nao editar a mao) */
/*LAYOUTS_INI*/
var LAYOUT_TAM = 12.5, LAYOUT_ALTURA = 120;   /* unidades = % da largura da area */
var LAYOUTS = [[[46.6,29.4],[20.9,106.5],[85.5,102.4],[8.4,33.4],[85.2,58.9],[19.8,69.9],[51.7,61.5],[81.7,19.9],[49.3,0.2],[52.4,97],[25.6,4.9],[84.4,0],[1,57.6],[71.2,80.4],[26.1,38],[1.5,90.6],[82.6,39.8],[66.4,25.7],[5.3,2.1],[63.9,44],[22.3,85.8],[2.7,17.5],[66.5,8.7],[68.3,60.6],[54,77.8],[68.9,106.9],[39.3,79.7],[37.2,99.4],[17.6,54.3],[45,43.9],[86.5,76.6],[1.9,105.7],[36.6,60.6],[26.8,20],[5.6,72.3]],[[62.1,74.2],[57.2,0.9],[2.5,80.7],[0.7,11.5],[58.4,37.9],[1.2,48.4],[50.1,105.6],[29.2,12.9],[31,46.6],[81.9,101.6],[87.4,40.1],[83.9,14.7],[34.3,76.5],[2.6,103.9],[19.1,94.2],[82.9,68.8],[5.7,32],[21.9,31.5],[51.5,22.3],[19.4,73],[63.9,90.8],[65.9,53.7],[78.5,84.6],[36.9,61.3],[73.1,34.6],[35.3,106.7],[2,63.5],[16.4,51.1],[87,0.2],[33.5,91.3],[49.2,88.8],[51.5,58.7],[14.9,11.4],[68.6,19.5],[72.2,0.4]],[[15.2,83.7],[84.7,7.4],[13.9,16.8],[83.3,77.3],[58.2,42.7],[54.3,4.6],[5.4,49.8],[34.2,53.3],[49.2,86.3],[34.2,18.6],[71.3,99.1],[81.1,33.1],[45.1,104.7],[16.7,104.8],[86.6,54.6],[12.7,0.4],[31.9,82],[64.5,63.8],[36.6,1.2],[60.5,22.3],[65.1,82],[41.5,35.6],[87.1,102.1],[0.2,72.6],[47.6,71.7],[19.9,45.6],[15,69.2],[1.7,106.1],[68.9,4.8],[32.7,67.5],[72.4,47.4],[2.8,31.2],[0.3,92],[30.9,99.2],[18.3,31.2]],[[20.1,12.2],[28.4,102.8],[80.8,17.3],[86.6,78.5],[1.9,60.7],[42.8,54],[50.8,1],[54.7,89.7],[44.4,25.7],[76.7,52.4],[3,92.1],[0.5,37.7],[21.6,46.6],[30.9,72],[83.2,99.8],[2,1.2],[60.5,57.1],[81.5,34.7],[62.8,31.9],[35.2,87.1],[49,105.5],[35.8,8.7],[19.6,31.4],[67.9,72.3],[2.3,19.3],[84.6,1.2],[62.5,15.8],[68.1,104],[51.5,72.2],[19.2,88],[66.3,0.4],[1.2,75.4],[68.8,86.7],[16.6,67.5],[10.7,106.2]]];   /* uma disposicao por etapa */
var LAYOUT_TREINO = [[58.7,73.2],[21.4,2.5],[85.4,7],[7.2,48.6],[12.4,104.7],[77.1,107.3],[78.6,38.3],[86.2,71.2]];
/*LAYOUTS_FIM*/
var ETAPAS = [
    { id: 'par', rotulo: 'Etapa 1 de 4', fala: 'vp-par', pedido: 'Toque nos n\u00fameros PARES (terminam em 0, 2, 4, 6 ou 8)', teste: function (c) { return c.num % 2 === 0; }, dica: null },
    { id: 'impar', rotulo: 'Etapa 2 de 4', fala: 'vp-impar', pedido: 'Toque nos n\u00fameros \u00cdMPARES (terminam em 1, 3, 5, 7 ou 9)', teste: function (c) { return c.num % 2 === 1; }, dica: null },
    { id: 'figura', rotulo: 'Etapa 3 de 4', fala: 'vp-estrela', pedido: 'Toque nas ESTRELAS DE CINCO PONTAS (as de quatro pontas n\u00e3o valem)', teste: function (c) { return c.forma === 0; }, dica: 'estrela' },
    { id: 'cor', rotulo: 'Etapa 4 de 4', fala: 'vp-vermelho', pedido: 'Toque s\u00f3 nas figuras VERMELHAS (laranja e rosa n\u00e3o valem)', teste: function (c) { return c.cor === 0; }, dica: 'vermelho' }
];
/* Treino: matriz pequena (2x4), so pares */
var TREINO_CELULAS = [
    { num: 37, forma: 1, cor: 1 }, { num: 24, forma: 2, cor: 2 }, { num: 51, forma: 3, cor: 3 }, { num: 62, forma: 4, cor: 4 },
    { num: 19, forma: 2, cor: 1 }, { num: 40, forma: 1, cor: 2 }, { num: 83, forma: 4, cor: 3 }, { num: 78, forma: 3, cor: 4 }
];

/* ---------- 2. UTILITARIOS ---------- */
function mulberry32(a) {
    return function () {
        a = (a + 0x6D2B79F5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
function embaralhar(arr, rnd) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
}
/* Matriz fixa (mesma semente = mesma matriz para todo avaliando):
   17 pares, 18 impares (numeros de 10 a 99), 7 estrelas de 5 pontas, 5 de 4 pontas, 7 vermelhas, 5 laranjas e 5 rosas. */
function gerarMatriz() {
    var rnd = mulberry32(31415);
    var n = LINHAS * COLUNAS; var idx = []; var i;
    for (i = 0; i < n; i++) { idx.push(i); }
    var pares = {}; var o1 = embaralhar(idx, rnd); for (i = 0; i < 17; i++) { pares[o1[i]] = true; }
    var estrelas = {}; var o2 = embaralhar(idx, rnd); for (i = 0; i < 7; i++) { estrelas[o2[i]] = true; }
    var estrelas4 = {}; var o3 = embaralhar(idx, rnd); var c4 = 0;
    for (i = 0; i < n && c4 < 5; i++) { if (!estrelas[o3[i]]) { estrelas4[o3[i]] = true; c4++; } }
    var verm = {}; var o4 = embaralhar(idx, rnd); var cv = 0;
    for (i = 0; i < n && cv < 7; i++) { if (!estrelas[o4[i]] || cv < 1) { verm[o4[i]] = true; cv++; } }
    var laranja = {}, rosa = {}; var o5 = embaralhar(idx, rnd); var cl = 0, cr = 0;
    for (i = 0; i < n; i++) {
        var q = o5[i];
        if (verm[q]) { continue; }
        if (cl < 5) { laranja[q] = true; cl++; } else if (cr < 5) { rosa[q] = true; cr++; }
    }
    var m = [];
    for (i = 0; i < n; i++) {
        var dezena = 1 + Math.floor(rnd() * 9);
        var unidade = pares[i] ? [0, 2, 4, 6, 8][Math.floor(rnd() * 5)] : [1, 3, 5, 7, 9][Math.floor(rnd() * 5)];
        var forma = estrelas[i] ? 0 : (estrelas4[i] ? 5 : 1 + Math.floor(rnd() * 4));
        var cor = verm[i] ? 0 : (laranja[i] ? 5 : (rosa[i] ? 6 : 1 + Math.floor(rnd() * 4)));   /* 5 laranjas e 5 rosas (iscas); o resto azul, verde, amarelo ou roxo */
        m.push({ num: dezena * 10 + unidade, forma: forma, cor: cor });
    }
    return m;
}
var MATRIZ = gerarMatriz();

/* ---------- 3. DESENHO DAS CELULAS ---------- */
function estrelaPts(cx, cy, R, r, pontas) {
    var p = []; var passo = 180 / pontas;
    for (var q = 0; q < pontas * 2; q++) { var a = (-90 + q * passo) * Math.PI / 180; var rr = (q % 2 === 0) ? R : r; p.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1)); }
    return p.join(' ');
}
function svgCelula(c) {
    var fill = CORES[c.cor]; var f = FORMAS[c.forma]; var s = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'; var ty = 62;
    if (f === 'estrela') { s += '<polygon points="' + estrelaPts(50, 54, 47, 21, 5) + '" fill="' + fill + '"/>'; ty = 65; }
    else if (f === 'estrela4') { s += '<polygon points="' + estrelaPts(50, 50, 47, 19, 4) + '" fill="' + fill + '"/>'; }
    else if (f === 'circulo') { s += '<circle cx="50" cy="50" r="44" fill="' + fill + '"/>'; }
    else if (f === 'quadrado') { s += '<rect x="9" y="9" width="82" height="82" rx="8" fill="' + fill + '"/>'; }
    else if (f === 'triangulo') { s += '<polygon points="50,8 95,90 5,90" fill="' + fill + '"/>'; ty = 76; }
    else { s += '<polygon points="50,4 96,50 50,96 4,50" fill="' + fill + '"/>'; }
    var tx = (c.cor === 3) ? '#3e2723' : '#ffffff';
    s += '<text x="50" y="' + ty + '" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="' + tx + '">' + c.num + '</text></svg>';
    return s;
}
function iconeDica(tipo) {
    if (tipo === 'estrela') { return '<svg class="dica" viewBox="0 0 100 100"><polygon points="' + estrelaPts(50, 54, 47, 21, 5) + '" fill="#8e24aa"/></svg>'; }
    if (tipo === 'vermelho') { return '<svg class="dica" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#e53935"/></svg>'; }
    return '';
}

/* ---------- 4. ESTADO ---------- */
var etapaIdx = 0;
var celulasAtuais = [];
var acertosEt = 0, comissEt = 0, alvosEt = 0, t0Et = 0, rodando = false, emTreino = false;
var cliques = [];
var resultadosEt = [];

/* ---------- 5. GRADE ---------- */
var layoutAtual = [];
function montarGrade(celulas, layout, testeAlvo) {
    celulasAtuais = celulas; layoutAtual = layout; var g = document.getElementById('grade'); var h = ''; alvosEt = 0;
    g.style.paddingBottom = (100 * LAYOUT_ALTURA / 100) + '%';   /* area com altura proporcional a largura */
    for (var i = 0; i < celulas.length; i++) {
        celulas[i].alvo = testeAlvo(celulas[i]); if (celulas[i].alvo) { alvosEt++; }
        h += '<button type="button" class="cel" data-i="' + i + '" style="left:' + layout[i][0] + '%;top:' + (100 * layout[i][1] / LAYOUT_ALTURA).toFixed(2) + '%;width:' + LAYOUT_TAM + '%;">' + svgCelula(celulas[i]) + '</button>';
    }
    g.innerHTML = h;
}
/* Indicador de ORGANIZACAO DA BUSCA (observacao clinica, sem norma): compara o caminho feito entre os acertos
   com um caminho curto de referencia (vizinho mais proximo, a partir do 1o acerto). 1 = busca muito organizada; perto de 0 = salta pela tela. */
function calcularVarredura(cl, lay) {
    var pts = [], i, j;
    for (i = 0; i < cl.length; i++) { if (cl[i].ok) { pts.push([lay[cl[i].celula][0] + LAYOUT_TAM / 2, lay[cl[i].celula][1] + LAYOUT_TAM / 2]); } }
    if (pts.length < 4) { return null; }
    function dist(a, b) { return Math.sqrt((a[0] - b[0]) * (a[0] - b[0]) + (a[1] - b[1]) * (a[1] - b[1])); }
    var feito = 0; for (i = 1; i < pts.length; i++) { feito += dist(pts[i - 1], pts[i]); }
    var rest = pts.slice(1), atual = pts[0], ref = 0;
    while (rest.length) { var m = 0; for (j = 1; j < rest.length; j++) { if (dist(atual, rest[j]) < dist(atual, rest[m])) { m = j; } } ref += dist(atual, rest[m]); atual = rest[m]; rest.splice(m, 1); }
    var ind = feito > 0 ? Math.min(1, ref / feito) : 1;
    return { indice: Math.round(ind * 100) / 100, caminho: Math.round(feito) };
}
function clicouCelula(e) {
    if (!rodando) { return; }
    var el = e.target; while (el && !(el.classList && el.classList.contains('cel'))) { el = el.parentNode; }
    if (!el || el.disabled) { return; }
    var i = parseInt(el.getAttribute('data-i'), 10); var c = celulasAtuais[i];
    el.disabled = true;
    var t = Date.now() - t0Et;
    if (c.alvo) { el.classList.add('certa'); acertosEt++; } else { el.classList.add('errada'); comissEt++; }
    cliques.push({ celula: i, ok: !!c.alvo, tMs: t });
    if (acertosEt >= alvosEt) { terminarEtapa(); }
}

/* ---------- 6. FLUXO ---------- */
function contagem(aoFim) {
    mostrarTela('tela-contagem'); var el = document.getElementById('numContagem'); var n = 3; el.textContent = n;
    var iv = setInterval(function () {
        n--;
        if (n > 0) { el.textContent = n; } else { clearInterval(iv); aoFim(); }
    }, 900);
}
function iniciarTreino() {
    emTreino = true; mostrarTela('tela-teste');
    document.getElementById('tituloVP').textContent = 'Treino';
    document.getElementById('barraProg').style.width = '0%';
    document.getElementById('pedido').innerHTML = 'Toque nos n\u00fameros PARES (terminam em 0, 2, 4, 6 ou 8)';
    document.getElementById('feedback').className = 'feedback';
    montarGrade(TREINO_CELULAS.map(function (c) { return { num: c.num, forma: c.forma, cor: c.cor }; }), LAYOUT_TREINO, ETAPAS[0].teste);
    acertosEt = 0; comissEt = 0; cliques = []; t0Et = Date.now(); rodando = true;
    document.getElementById('btnTerminei').style.display = 'none';
}
function iniciarEtapa(i) {
    etapaIdx = i; emTreino = false; var et = ETAPAS[i];
    mostrarTela('tela-teste');
    document.getElementById('tituloVP').textContent = et.rotulo;
    document.getElementById('barraProg').style.width = Math.round(100 * i / ETAPAS.length) + '%';
    document.getElementById('pedido').innerHTML = et.pedido + (et.dica ? iconeDica(et.dica) : '');
    document.getElementById('feedback').className = 'feedback';
    montarGrade(MATRIZ.map(function (c) { return { num: c.num, forma: c.forma, cor: c.cor }; }), LAYOUTS[i], et.teste);
    acertosEt = 0; comissEt = 0; cliques = []; t0Et = Date.now(); rodando = true;
    document.getElementById('btnTerminei').style.display = 'inline-block';
}
function terminarEtapa() {
    if (!rodando) { return; }
    rodando = false; var tempo = Date.now() - t0Et;
    var grade = document.querySelectorAll('.cel'); for (var k = 0; k < grade.length; k++) { grade[k].disabled = true; }
    if (emTreino) {
        var fb = document.getElementById('feedback'); fb.className = 'feedback ok'; fb.textContent = 'Muito bem!';
        setTimeout(function () {
            mostrarInstrucao('vp-valer', 'Agora vai valer o tempo! Quando aparecer 3, 2, 1, comece.', 'Come\u00e7ar', function () { contagem(function () { iniciarEtapa(0); }); });
        }, 1300);
        return;
    }
    var omis = alvosEt - acertosEt;
    resultadosEt.push({ etapa: ETAPAS[etapaIdx].id, alvos: alvosEt, acertos: acertosEt, comissoes: comissEt, omissoes: omis, tempoMs: tempo, varredura: calcularVarredura(cliques, layoutAtual), layout: etapaIdx + 1, cliques: cliques.slice() });
    var prox = etapaIdx + 1;
    if (prox >= ETAPAS.length) { finalizarModulo(); return; }
    var e2 = ETAPAS[prox];
    setTimeout(function () {
        mostrarInstrucao(e2.fala, e2.pedido + '. Toque o mais r\u00e1pido que puder, sem errar.', 'Come\u00e7ar', function () { contagem(function () { iniciarEtapa(prox); }); });
    }, 500);
}
function calcularIEP() {
    var A = 0, T = 0, C = 0, O = 0, L = 0;
    for (var i = 0; i < resultadosEt.length; i++) { var r = resultadosEt[i]; A += r.acertos; T += r.tempoMs; C += r.comissoes; O += r.omissoes; L += r.alvos; }
    var seg = T / 1000; var taxa = L > 0 ? (C + O) / L : 0;
    var iep = seg > 0 ? (A / seg) * Math.max(0, 1 - taxa) : 0;
    return { acertos: A, tempoSeg: Math.round(seg * 10) / 10, comissoes: C, omissoes: O, alvos: L, taxaErros: Math.round(taxa * 1000) / 1000, iep: Math.round(iep * 1000) / 1000 };
}
function finalizarModulo() {
    var tot = calcularIEP();
    var dados = { modulo: 'B', etapas: resultadosEt, totais: tot, iep: tot.iep };
    window._bafcVelocidade = dados;
    document.getElementById('fimTitulo').textContent = 'Muito bem!';
    if (BAFC_MOD.bateria) {
        document.getElementById('fimTexto').textContent = 'Vamos para o pr\u00f3ximo jogo...';
        mostrarTela('tela-fim'); bafcFim(dados);
    } else {
        var h = '<table><tr><th>Etapa</th><th>Alvos</th><th>Acertos</th><th>Cliques errados</th><th>N\u00e3o tocou</th><th>Tempo</th></tr>';
        for (var i = 0; i < resultadosEt.length; i++) { var r = resultadosEt[i]; h += '<tr><td>' + r.etapa + '</td><td>' + r.alvos + '</td><td>' + r.acertos + '</td><td>' + r.comissoes + '</td><td>' + r.omissoes + '</td><td>' + fmtSeg(r.tempoMs) + ' s</td></tr>'; }
        h += '</table>';
        document.getElementById('fimTabela').innerHTML = h;
        document.getElementById('fimTexto').textContent = 'IEP (efici\u00eancia): ' + tot.iep + '  |  tempo total: ' + tot.tempoSeg + ' s  |  taxa de erros: ' + tot.taxaErros;
        mostrarTela('tela-fim');
    }
}
function comecar() {
    resultadosEt = [];
    mostrarInstrucao('vp-intro', 'Voc\u00ea vai ver v\u00e1rias figuras com n\u00fameros. Toque s\u00f3 nas que eu pedir, o mais r\u00e1pido que puder, sem errar. Vamos treinar primeiro.', 'Continuar', function () {
        mostrarInstrucao('vp-par', 'Toque nos n\u00fameros PARES (terminam em 0, 2, 4, 6 ou 8). Toque o mais r\u00e1pido que puder, sem errar.', 'Treinar', iniciarTreino);
    });
}

/* ---------- 7. INICIALIZACAO DIRETA ---------- */
document.getElementById('btnComecar').addEventListener('click', comecar);
document.getElementById('btnInstrOuvir').addEventListener('click', instrOuvir);
document.getElementById('btnInstrOk').addEventListener('click', instrContinuar);
document.getElementById('grade').addEventListener('click', clicouCelula);
document.getElementById('btnTerminei').addEventListener('click', terminarEtapa);
</script>
